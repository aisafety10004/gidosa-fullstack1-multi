plugins{
//    id 'java-library'
    id 'java-test-fixtures'
//    id 'maven-publish'
}

bootJar {
    enabled = false
    archiveFileName = 'gidosa-common-api.jar'
}

jar {
    enabled = true
}

test {
    enabled = false
}
dependencies {
    implementation project(path: ':gidosa-common')
//    implementation project(path: ':gidosa-auth')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // springdoc swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    testImplementation project(path: ':gidosa-common')
//    testImplementation project(path: ':gidosa-auth')

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}