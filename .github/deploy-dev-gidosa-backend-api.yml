name: dev gidosa-backend-api

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "api-gidosa-image/**"
      - ".github/workflows/deploy-prod-gidosa-backend-api.yml"
  workflow_dispatch:

env:
  RDB_MASTER_URL: ${{ secrets.RDB_DEV_INNER_MASTER_URL }}
  RDB_MASTER_USERNAME: ${{ secrets.RDB_DEV_INNER_MASTER_USERNAME }}
  RDB_MASTER_PASSWORD: ${{ secrets.RDB_DEV_INNER_MASTER_PASSWORD }}
  RDB_SLAVE_URL: ${{ secrets.RDB_DEV_INNER_SLAVE_URL }}
  RDB_SLAVE_USERNAME: ${{ secrets.RDB_DEV_INNER_SLAVE_USERNAME }}
  RDB_SLAVE_PASSWORD: ${{ secrets.RDB_DEV_INNER_SLAVE_PASSWORD }}
  JWT_SECRET_KEY_MEMBERUSER: ${{ secrets.JWT_DEV_SECRET_KEY_MEMBERUSER }}
  JWT_SECRET_KEY_MEMBERMANAGER: ${{ secrets.JWT_DEV_SECRET_KEY_MEMBERMANAGER }}
  JWT_ISSUER_MEMBERUSER: ${{ secrets.JWT_DEV_ISSUER_MEMBERUSER }}
  JWT_ISSUER_MEMBERMANAGER: ${{ secrets.JWT_DEV_ISSUER_MEMBERMANAGER }}

jobs:
  # 의존성 빌드 및 codedeploy event
  build-codedeploy:
    environment: dev
    runs-on: ubuntu-22.04
    permissions: write-all
    #    permissions: read-all
