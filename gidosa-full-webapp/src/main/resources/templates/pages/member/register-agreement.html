<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>회원가입 약관 동의 - 위험안전 관리</title>
</head>
<body>
    <div layout:fragment="content" class="max-w-2xl mx-auto py-8 px-4">
        <h2 class="text-2xl font-bold mb-8 text-center">회원가입</h2>
        <form th:action="@{/member/register}" method="GET" class="space-y-6">
            <!-- 전체 동의 -->
            <div class="bg-gray-50 p-4 rounded-lg">
                <label class="flex items-center space-x-3">
                    <input type="checkbox" id="agree-all" class="h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary">
                    <span class="text-lg font-medium">전체 동의</span>
                </label>
                <p class="mt-1 text-sm text-gray-500 ml-8">
                    위험안전 관리 서비스 이용약관, 개인정보 수집 및 이용, 프로모션 정보 수신에 모두 동의합니다.
                </p>
            </div>

            <!-- 필수 약관 -->
            <div class="space-y-4">
                <div class="border rounded-lg p-4">
                    <div class="flex items-center justify-between mb-2">
                        <label class="flex items-center space-x-3">
                            <input type="checkbox" name="terms" required
                                   class="h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary">
                            <span class="font-medium">서비스 이용약관 동의 <span class="text-red-500">(필수)</span></span>
                        </label>
                        <a th:href="@{/document/terms1}" class="text-sm text-gray-500 hover:text-primary">자세히</a>
                    </div>
                    <div class="mt-2 h-24 overflow-y-auto bg-gray-50 p-3 text-sm text-gray-600 rounded">
                        서비스 이용약관 내용이 여기에 표시됩니다...
                    </div>
                </div>

                <div class="border rounded-lg p-4">
                    <div class="flex items-center justify-between mb-2">
                        <label class="flex items-center space-x-3">
                            <input type="checkbox" name="privacy" required
                                   class="h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary">
                            <span class="font-medium">개인정보 수집 및 이용 동의 <span class="text-red-500">(필수)</span></span>
                        </label>
                        <a th:href="@{/document/privacy1}" class="text-sm text-gray-500 hover:text-primary">자세히</a>
                    </div>
                    <div class="mt-2 h-24 overflow-y-auto bg-gray-50 p-3 text-sm text-gray-600 rounded">
                        개인정보 수집 및 이용 약관 내용이 여기에 표시됩니다...
                    </div>
                </div>

                <!-- 선택 약관 -->
                <div class="border rounded-lg p-4">
                    <div class="flex items-center justify-between mb-2">
                        <label class="flex items-center space-x-3">
                            <input type="checkbox" name="marketing"
                                   class="h-5 w-5 text-primary rounded border-gray-300 focus:ring-primary">
                            <span class="font-medium">프로모션 정보 수신 동의 <span class="text-gray-500">(선택)</span></span>
                        </label>
                        <a th:href="@{/document/marketing1}" class="text-sm text-gray-500 hover:text-primary">자세히</a>
                    </div>
                    <div class="mt-2 h-24 overflow-y-auto bg-gray-50 p-3 text-sm text-gray-600 rounded">
                        프로모션 정보 수신 동의 내용이 여기에 표시됩니다...
                    </div>
                </div>
            </div>

            <div class="flex justify-center space-x-4">
                <a th:href="@{/auth/login}"
                   class="px-6 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    다음
                </button>
            </div>
        </form>
    </div>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const agreeAllCheckbox = document.getElementById('agree-all');
                const checkboxes = document.querySelectorAll('input[type="checkbox"]:not(#agree-all)');

                // 전체 동의 체크박스 이벤트
                agreeAllCheckbox.addEventListener('change', function() {
                    checkboxes.forEach(checkbox => {
                        checkbox.checked = this.checked;
                    });
                });

                // 개별 체크박스 이벤트
                checkboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const allChecked = Array.from(checkboxes).every(c => c.checked);
                        agreeAllCheckbox.checked = allChecked;
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
