<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title th:text="${construction.name + ' - 현장공사'}"></title>
</head>
<body>
<!-- <div layout:fragment="content" class="bg-white">
    <h1 th:text="${construction.location} + ' - 현장공사 general 메인 페이지'"></h1>
</div> -->
<div layout:fragment="content">
    <div class="max-w-2xl mx-auto py-8 px-4" id="mobile1-content">
<!--        <div class="flex flex-col items-center w-full max-w-md mx-auto px-4 py-4">-->
<!--            <h1 th:text="${construction.location} + ' - 공사 출근하기 메인 페이지'"></h1>-->
<!--        </div>-->
        <!-- 에러 메시지 표시 영역 추가 -->
        <div th:if="${errorMessage}" class="mb-6 rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700" th:text="${errorMessage}">
            </div>
        </div>
        <!-- 성공 메시지 표시 영역 추가 -->
        <div th:if="${successMessage}" class="mb-6 rounded-md bg-green-50 p-4">
            <div class="text-sm text-green-700" th:text="${successMessage}">
            </div>
        </div>
        <h2 class="text-2xl font-bold mb-8 text-center">출근등록</h2>
        <form th:action="@{/general/work-record/start}" method="POST" class="space-y-6" id="workRecordStartForm" enctype="multipart/form-data">
            <input type="hidden" name="constructionId" th:value="${construction.id}" />
            <!-- 이름 -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">이름<!--(수정가능)--></label>
                <div class="mt-1">
                    <input type="text" id="name" name="name" th:value="${#authentication.principal.memberGeneral.name}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="이름을 입력해주세요" readonly>
                </div>
            </div>

            <!-- 휴대폰 번호 -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">휴대폰 번호<!--(수정가능)--></label>
                <div class="mt-1">
                    <input type="tel" id="phone" name="phone" th:value="${#authentication.principal.memberGeneral.phone}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="'-' 없이 입력해주세요" readonly>
                </div>
            </div>
            
            <!-- 건강상태 확인 -->
            <div class="border border-gray-200 rounded-md">
                <h3 class="font-medium text-gray-700 mb-3">
                    스스로 업무수행이 가능한지 점검하여 출근여부를 결정하세요
<!--                    스스로 업무수행이 가능한지 점검하여 보고합니다.(1개 선택)-->
<!--                    <br>(자신의 건강상태를 확인하여 출근여부를 결정하세요)-->
                </h3>
                <div class="flex items-start pt-3 pb-3 pl-1 pr-1 bg-white border-gray-200 rounded-md">
                    <div class="flex items-center h-5 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                        <input id="healthCheck" name="healthCheck" type="checkbox" required
                            class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                    </div>
                    <div class="ml-1 mt-0.5 text-sm">
                        <label for="healthCheck" class="font-medium text-gray-700">나는 업무를 수행할 건강상태를 유지하고 있다.</label>
                    </div>
                </div>
            </div>
            
            <!-- 근로자 정면 사진 -->
            <div class="border border-gray-200 rounded-md">
                <h3 class="font-medium text-gray-700 mb-3">
                    출근할 근로자 정면 사진을 촬영하여 등록합니다.(필수 등록)
                    <br>(방법 : 휴대폰 사진을 찍은 후에 갤러리에서 첨부 가능)
                </h3>
                <div class="mt-2 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                    <input type="file" id="workerStartPhoto" name="workerStartPhoto" accept="image/*" required
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-dark">
                    <p class="mt-1 text-sm text-gray-500">
                        사진은 5MB 이하의 이미지 파일만 업로드 가능합니다.
                    </p>
                </div>
                <!-- 미리보기 영역 -->
                <div id="photoPreview" class="mt-3 hidden">
                    <img id="previewImage" src="#" alt="미리보기" class="w-full max-h-64 object-contain">
                </div>
            </div>
            
            <!-- 근무시간 계획 확인 -->
            <div class="border border-gray-200 rounded-md">
                <h3 class="font-medium text-gray-700 mb-3">금일 근무시간 단축/연장계획을 확인합니다.</h3>
                <div class="space-y-2 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="planToGoOut" name="planToGoOut" type="checkbox"
                                class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="planToGoOut" class="font-medium text-gray-700">근무중 외출할 계획이 있다.</label>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="planToLeaveEarly" name="planToLeaveEarly" type="checkbox"
                                class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="planToLeaveEarly" class="font-medium text-gray-700">조기 퇴근(휴가) 예정이다.</label>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="planToWorkOvertime" name="planToWorkOvertime" type="checkbox"
                                class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="planToWorkOvertime" class="font-medium text-gray-700">연장/야간근무할 계획이다.</label>
                        </div>
                    </div>
                    <div id="workPlanError" class="hidden mt-2 text-sm text-red-600">
                        근무 계획을 하나 이상 선택해주세요.
                    </div>
                </div>
            </div>
            
            <!-- 작업중 준수사항 -->
            <div class="border border-gray-200 rounded-md">
                <h3 class="font-medium text-gray-700 mb-3">
                    작업중 준수할 필수사항을 안내합니다.(필수 선택)
                </h3>
                <div class="space-y-2 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="safetyRuleCheck" name="safetyRuleCheck" type="checkbox" required
                                class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="safetyRuleCheck" class="font-medium text-gray-700">작업중 안전수칙을 준수한다.</label>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="riskReportCheck" name="riskReportCheck" type="checkbox" required
                                class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="riskReportCheck" class="font-medium text-gray-700">위험요인은 절차대로 보고한다.</label>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="protectiveGearCheck" name="protectiveGearCheck" type="checkbox" required
                                class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="protectiveGearCheck" class="font-medium text-gray-700">작업중 보호구를 상시 착용한다.</label>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" id="submitBtn"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    출근등록
                </button>
            </div>
        </form>
    </div>
    <div class="tailwind-section" id="pc1-content">
        <h1>출근하기 - 데스크톱 상단 화면</h1>
    </div>
</div>
<th:block layout:fragment="script">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('workRecordStartForm');
            const submitBtn = document.getElementById('submitBtn');
            
            // 파일 업로드 미리보기
            const workerStartPhoto = document.getElementById('workerStartPhoto');
            const photoPreview = document.getElementById('photoPreview');
            const previewImage = document.getElementById('previewImage');
            
            workerStartPhoto.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        photoPreview.classList.remove('hidden');
                    }
                    reader.readAsDataURL(file);
                } else {
                    photoPreview.classList.add('hidden');
                }
            });
            
            // 폼 제출 전 유효성 검사
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 필수 항목 검사
                const healthCheck = document.getElementById('healthCheck').checked;
                const workerStartPhotoFile = document.getElementById('workerStartPhoto').files.length > 0;
                const safetyRuleCheck = document.getElementById('safetyRuleCheck').checked;
                const riskReportCheck = document.getElementById('riskReportCheck').checked;
                const protectiveGearCheck = document.getElementById('protectiveGearCheck').checked;
                
                // 근무 계획 체크박스 (적어도 하나는 체크되어야 함)
                const planToGoOut = document.getElementById('planToGoOut').checked;
                const planToLeaveEarly = document.getElementById('planToLeaveEarly').checked;
                const planToWorkOvertime = document.getElementById('planToWorkOvertime').checked;
                //const workPlanChecked = planToGoOut || planToLeaveEarly || planToWorkOvertime;
                const workPlanError = document.getElementById('workPlanError');
                
                // 유효성 검사
                let isValid = true;
                
                // 건강상태 확인 체크
                if (!healthCheck) {
                    document.getElementById('healthCheck').focus();
                    isValid = false;
                }
                
                // 사진 첨부 확인
                if (!workerStartPhotoFile) {
                    document.getElementById('workerStartPhoto').focus();
                    isValid = false;
                }
                
                // 근무 계획 확인
                // if (!workPlanChecked) {
                //     workPlanError.classList.remove('hidden');
                //     document.getElementById('planToGoOut').focus();
                //     isValid = false;
                // } else {
                //     workPlanError.classList.add('hidden');
                // }
                
                // 준수사항 체크 확인
                if (!safetyRuleCheck) {
                    document.getElementById('safetyRuleCheck').focus();
                    isValid = false;
                }
                
                if (!riskReportCheck) {
                    document.getElementById('riskReportCheck').focus();
                    isValid = false;
                }
                
                if (!protectiveGearCheck) {
                    document.getElementById('protectiveGearCheck').focus();
                    isValid = false;
                }
                
                // 모든 유효성 검사 통과시 폼 제출
                if (isValid) {
                    form.submit();
                }
            });
        });
    </script>
</th:block>
</body>
</html>
