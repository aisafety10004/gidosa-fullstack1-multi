        <!-- 에러 메시지 표시 영역 추가 -->
        <div th:if="${errorMessage}" class="mb-6 rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700" th:text="${errorMessage}">

        </div>
        <!-- 성공 메시지 표시 영역 추가 -->

            <div class="text-sm text-green-700" th:text="${successMessage}">
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-8 text-center">퇴근등록</h2>
        
        <form th:action="@{/general/work-record/leave}" method="POST" class="space-y-6" id="workRecordLeaveForm" enctype="multipart/form-data">
            <input type="hidden" name="constructionId" th:value="${construction.id}" />
            
            <!-- 이름 -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">이름</label>
                <div class="mt-1">
                    <input type="text" id="name" name="name" th:value="${#authentication.principal.memberGeneral.name}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="이름을 입력해주세요" readonly>
                </div>
            </div>

            <!-- 휴대폰 번호 -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">휴대폰 번호</label>
                <div class="mt-1">
                    <input type="tel" id="phone" name="phone" th:value="${#authentication.principal.memberGeneral.phone}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="'-' 없이 입력해주세요" readonly>
                </div>
            </div>
            
            <!-- 1. 업무수행결과 점검 -->
            <div>
                <p class="block text-sm font-medium text-gray-700">금일 업무수행결과를 스스로 점검하여 보고바랍니다.</p>
                <div class="mt-2 space-y-2 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="bestEffortCheck" name="bestEffortCheck" type="checkbox" value="true"
                                   class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="bestEffortCheck" class="font-medium text-gray-700">나는 작업중 최선을 다해 업무를 수행했다.</label>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="noAccidentCheck" name="noAccidentCheck" type="checkbox" value="true"
                                   class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="noAccidentCheck" class="font-medium text-gray-700">나는 작업중 무재해로서 퇴근함을 확인한다.</label>
                        </div>
                    </div>
                </div>
                <p id="checkboxError" class="mt-1 text-sm text-red-600 hidden">최소 1개 이상의 항목을 선택해주세요.</p>
            </div>
            
            <!-- 2. 퇴근하는 근로자 정면 사진 -->

<!--                    퇴근하는 근로자 정면 사진을 촬영하여 등록 바랍니다.(필수 등록)-->
<!--                    <br>(방법 : 휴대폰 사진을 찍은 후에 갤러리에서 첨부 가능)-->
<!--                </label>-->

<!--                        </svg>-->

            <div>
                <label for="workerLeavePhoto" class="block text-sm font-medium text-gray-700">
                    퇴근하는 근로자 정면 사진을 촬영하여 등록 바랍니다.(필수 등록)
                    <br>(방법 : 휴대폰 사진을 찍은 후에 갤러리에서 첨부 가능)
                </label>
                <div class="mt-2 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                    <input type="file" id="workerLeavePhoto" name="workerLeavePhoto" accept="image/*" required
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-dark">
                    <p class="mt-1 text-xs text-gray-500">
                        사진은 5MB 이하의 이미지 파일만 업로드 가능합니다.
                    </p>
                </div>
                <!-- 미리보기 영역 -->
                <div id="photoPreview" class="mt-3 hidden">
                    <img id="previewImage" src="#" alt="미리보기" class="w-full max-h-64 object-contain">
                </div>
            </div>
            
            <!-- 3. 개선 사항 -->
            <div>
                <label for="improvementSuggestions" class="block text-sm font-medium text-gray-700">금일 근무중 개선할 사항이 있으시면 등록 바랍니다.</label>
                <div class="mt-1">
                    <textarea id="improvementSuggestions" name="improvementSuggestions" rows="3"
                              class="shadow-sm focus:ring-primary focus:border-primary block w-full sm:text-sm border-gray-300 rounded-md"
                              placeholder="개선 사항을 입력해주세요"></textarea>
                </div>
            </div>
            
            <!-- 4. 출근 계획 -->
            <div>
                <p class="block text-sm font-medium text-gray-700">향후 출근할 계획이 있으면 등록 바랍니다.</p>
                <div class="mt-2 space-y-2 pt-3 pb-3 pl-3 pr-3 bg-white border-gray-200 rounded-md">
                    <div class="flex items-center">
                        <input id="planToComeNextDay-yes" name="planToComeNextDay" type="radio" value="true" checked
                               class="focus:ring-primary h-4 w-4 text-primary border-gray-300">
                        <label for="planToComeNextDay-yes" class="ml-3 block text-sm font-medium text-gray-700">
                            내일은 정상출근합니다.
                        </label>
                    </div>
                    <div class="flex items-center">
                        <input id="planToComeNextDay-no" name="planToComeNextDay" type="radio" value="false"
                               class="focus:ring-primary h-4 w-4 text-primary border-gray-300">
                        <label for="planToComeNextDay-no" class="ml-3 block text-sm font-medium text-gray-700">
                            내일은 결근예정입니다.
                        </label>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" id="submitButton"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    퇴근등록
                </button>
            </div>
        </form>
    </div>
    <div class="tailwind-section" id="pc1-content">
        <h1>퇴근하기 - 데스크톱 상단 화면</h1>
    </div>
</div>
<th:block layout:fragment="script">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('workRecordLeaveForm');
            const bestEffortCheck = document.getElementById('bestEffortCheck');
            const noAccidentCheck = document.getElementById('noAccidentCheck');
            const checkboxError = document.getElementById('checkboxError');
            const workerLeavePhoto = document.getElementById('workerLeavePhoto');
            const photoPreview = document.getElementById('photoPreview');
            const previewImage = document.getElementById('previewImage');
            const photoError = document.getElementById('photoError');
            
            // 이미지 미리보기 설정
            workerLeavePhoto.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    previewImage.src = URL.createObjectURL(file);
                    photoPreview.classList.remove('hidden');
                    photoError.classList.add('hidden');
                } else {
                    photoPreview.classList.add('hidden');
                }
            });
            
            // 폼 제출 전 유효성 검사
            form.addEventListener('submit', function(event) {
                let isValid = true;
                
                // 체크박스 유효성 검사 - 최소 1개 이상 체크되어야 함
                if (!bestEffortCheck.checked && !noAccidentCheck.checked) {
                    checkboxError.classList.remove('hidden');
                    isValid = false;
                    bestEffortCheck.focus();
                } else {
                    checkboxError.classList.add('hidden');
                }
                
                // 사진 유효성 검사
                if (!workerLeavePhoto.files || workerLeavePhoto.files.length === 0) {
                    photoError.classList.remove('hidden');
                    isValid = false;
                    workerLeavePhoto.focus();
                } else {
                    photoError.classList.add('hidden');
                }
                
                if (!isValid) {
                    event.preventDefault();
                }
            });
        });
    </script>
</th:block>
