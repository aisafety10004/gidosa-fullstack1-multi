<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title>회원가입 - 위험안전 관리</title>
</head>
<body>
    <div layout:fragment="content" class="max-w-2xl mx-auto py-8 px-4">
        <h2 class="text-2xl font-bold mb-8 text-center">회원가입</h2>
        
        <!-- 에러 메시지 표시 영역 추가 -->
        <div th:if="${errorMessage}" class="mb-6 rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700" th:text="${errorMessage}">
            </div>
        </div>
        
        <form th:action="@{/general/member/register}" method="POST" class="space-y-6" id="registerForm" enctype="multipart/form-data">
            <input type="hidden" name="constructionId" th:value="${construction.id}" />
            <!-- 아이디 -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">아이디</label>
                <div class="mt-1 flex">
                    <input type="text" id="username" name="username" required
                           class="flex-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           th:value="${memberRegisterDto != null ? memberRegisterDto.username : ''}"
                           placeholder="영문, 숫자 조합 6-20자">
                    <button type="button" onclick="checkUsername()"
                            class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        중복확인
                    </button>
                </div>
                <p class="mt-1 text-sm text-red-600 hidden" id="username-error"></p>
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">비밀번호</label>
                <div class="mt-1">
                    <input type="password" id="password" name="password" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="영문, 숫자, 특수문자 조합 8-20자">
                </div>
                <p class="mt-1 text-sm text-red-600 hidden" id="password-error"></p>
            </div>

            <!-- 비밀번호 확인 -->
            <div>
                <label for="password-confirm" class="block text-sm font-medium text-gray-700">비밀번호 확인</label>
                <div class="mt-1">
                    <input type="password" id="password-confirm" name="passwordConfirm" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="비밀번호를 다시 입력해주세요">
                </div>
                <p class="mt-1 text-sm text-red-600 hidden" id="password-confirm-error"></p>
            </div>

            <!-- 이름 -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">이름</label>
                <div class="mt-1">
                    <input type="text" id="name" name="name" th:value="${memberRegisterDto != null ? memberRegisterDto.name : ''}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="이름을 입력해주세요">
                </div>
            </div>

            <!-- 이메일 -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">이메일</label>
                <div class="mt-1">
                    <input type="email" id="email" name="email" th:value="${memberRegisterDto != null ? memberRegisterDto.email : ''}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="example@email.com">
                </div>
            </div>

            <!-- 휴대폰 번호 -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">휴대폰 번호</label>
                <div class="mt-1">
                    <input type="tel" id="phone" name="phone" th:value="${memberRegisterDto != null ? memberRegisterDto.phone : ''}" required
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="'-' 없이 입력해주세요">
                </div>
            </div>

            <!-- 직책 -->
            <div>
                <label for="position" class="block text-sm font-medium text-gray-700">직책</label>
                <div class="mt-1">
                    <input type="text" id="position" name="position" th:value="${memberRegisterDto != null ? memberRegisterDto.position : ''}"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="직책을 입력해주세요">
                </div>
            </div>

            <!-- 직종 -->
            <div>
                <label for="jobType" class="block text-sm font-medium text-gray-700">직종</label>
                <div class="mt-1">
                    <input type="text" id="jobType" name="jobType" th:value="${memberRegisterDto != null ? memberRegisterDto.jobType : ''}"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="직종을 입력해주세요">
                </div>
            </div>

            <!-- 비상연락번호 -->
            <div>
                <label for="emergencyContact" class="block text-sm font-medium text-gray-700">비상연락번호</label>
                <div class="mt-1">
                    <input type="tel" id="emergencyContact" name="emergencyContact" th:value="${memberRegisterDto != null ? memberRegisterDto.emergencyContact : ''}"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="'-' 없이 입력해주세요">
                </div>
            </div>

            <!-- 프로필 사진 업로드 -->
            <div>
                <label for="profilePhotoFile" class="block text-sm font-medium text-gray-700">본인사진</label>
                <div class="mt-1">
                    <input type="file" id="profilePhotoFile" name="profilePhotoFile"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*">
                </div>
                <p class="mt-1 text-xs text-gray-500">사진 파일만 업로드 가능합니다.</p>
            </div>

            <!-- 근로계약서 업로드 -->
            <div>
                <label for="laborContractFile" class="block text-sm font-medium text-gray-700">근로계약서</label>
                <div class="mt-1">
                    <input type="file" id="laborContractFile" name="laborContractFile"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*,application/pdf">
                </div>
                <p class="mt-1 text-xs text-gray-500">이미지 또는 PDF 파일만 업로드 가능합니다.</p>
            </div>

            <!-- 건설업기초안전보건교육이수증 업로드 -->
            <div>
                <label for="safetyEducationCertFile" class="block text-sm font-medium text-gray-700">건설업기초안전보건교육이수증</label>
                <div class="mt-1">
                    <input type="file" id="safetyEducationCertFile" name="safetyEducationCertFile"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*,application/pdf">
                </div>
                <p class="mt-1 text-xs text-gray-500">이미지 또는 PDF 파일만 업로드 가능합니다.</p>
            </div>

            <!-- 보호구착용서약서 업로드 -->
            <div>
                <label for="protectiveGearPledgeFile" class="block text-sm font-medium text-gray-700">보호구착용서약서</label>
                <div class="mt-1">
                    <input type="file" id="protectiveGearPledgeFile" name="protectiveGearPledgeFile"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*,application/pdf">
                </div>
                <p class="mt-1 text-xs text-gray-500">이미지 또는 PDF 파일만 업로드 가능합니다.</p>
            </div>

            <!-- 기타문서1 업로드 -->
            <div>
                <label for="etcDoc1Description" class="block text-sm font-medium text-gray-700">기타입력1</label>
                <div class="mt-1">
                    <input type="text" id="etcDoc1Description" name="etcDoc1Description" th:value="${memberRegisterDto != null ? memberRegisterDto.etcDoc1Description : ''}"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="기타문서1 설명을 입력해주세요">
                </div>
                <div class="mt-1">
                    <input type="file" id="etcDoc1File" name="etcDoc1File"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*,application/pdf">
                </div>
                <p class="mt-1 text-xs text-gray-500">이미지 또는 PDF 파일만 업로드 가능합니다.</p>
            </div>

            <!-- 기타문서2 업로드 -->
            <div>
                <label for="etcDoc2Description" class="block text-sm font-medium text-gray-700">기타입력2</label>
                <div class="mt-1">
                    <input type="text" id="etcDoc2Description" name="etcDoc2Description" th:value="${memberRegisterDto != null ? memberRegisterDto.etcDoc2Description : ''}"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="기타문서2 설명을 입력해주세요">
                </div>
                <div class="mt-1">
                    <input type="file" id="etcDoc2File" name="etcDoc2File"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*,application/pdf">
                </div>
                <p class="mt-1 text-xs text-gray-500">이미지 또는 PDF 파일만 업로드 가능합니다.</p>
            </div>

            <!-- 기타문서3 업로드 -->
            <div>
                <label for="etcDoc3Description" class="block text-sm font-medium text-gray-700">기타입력3</label>
                <div class="mt-1">
                    <input type="text" id="etcDoc3Description" name="etcDoc3Description" th:value="${memberRegisterDto != null ? memberRegisterDto.etcDoc3Description : ''}"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           placeholder="기타문서3 설명을 입력해주세요">
                </div>
                <div class="mt-1">
                    <input type="file" id="etcDoc3File" name="etcDoc3File"
                           class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                           accept="image/*,application/pdf">
                </div>
                <p class="mt-1 text-xs text-gray-500">이미지 또는 PDF 파일만 업로드 가능합니다.</p>
            </div>

            <div class="flex justify-center space-x-4 pt-4">
                <a th:href="@{${'/general/auth/login?constructionId=' + construction.id}}"
                   class="px-6 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    취소
                </a>
                <button type="submit"
                        class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    가입하기
                </button>
            </div>
        </form>
    </div>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            // 아이디 중복 확인 여부를 추적하는 변수 추가
            let isUsernameChecked = false;
            let lastCheckedUsername = '';

            function checkUsername() {
                const username = document.getElementById('username').value;
                const errorElement = document.getElementById('username-error');
                
                // 아이디 유효성 검사
                if (!/^[A-Za-z0-9]{6,20}$/.test(username)) {
                    errorElement.textContent = '아이디는 영문, 숫자 조합 6-20자로 입력해주세요.';
                    errorElement.classList.remove('hidden');
                    isUsernameChecked = false;
                    return;
                }

                fetch('/general/member/check-username?username=' + username)
                    .then(response => response.json())
                    .then(data => {
                        if (data.available) {
                            errorElement.textContent = '사용 가능한 아이디입니다.';
                            errorElement.classList.remove('text-red-600');
                            errorElement.classList.add('text-green-600');
                            isUsernameChecked = true;
                            lastCheckedUsername = username;
                        } else {
                            errorElement.textContent = '이미 사용중인 아이디입니다.';
                            errorElement.classList.add('text-red-600');
                            errorElement.classList.remove('text-green-600');
                            isUsernameChecked = false;
                        }
                        errorElement.classList.remove('hidden');
                    }).catch(e => {
                        alert('중복확인 도중 에러가 발생하였습니다.\n\n관리자에게 문의하세요.');
                        isUsernameChecked = false;
                    });
            }

            // username input의 변경을 감지하여 중복확인 상태 초기화
            // document.getElementById('username').addEventListener('input', function() {
            //     if (this.value !== lastCheckedUsername) {
            //         isUsernameChecked = false;

            //         const errorElement = document.getElementById('username-error');
            //         errorElement.textContent = '중복확인이 필요합니다.';
            //         errorElement.classList.add('text-red-600');
            //         errorElement.classList.remove('text-green-600');
            //         errorElement.classList.remove('hidden');
            //     }
            // });

            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 중복확인 여부 검사
                const username = document.getElementById('username').value;
                if (!isUsernameChecked || username !== lastCheckedUsername) {
                    alert('아이디 중복확인을 해주세요.');
                    return;
                }

                // 비밀번호 유효성 검사
                const password = document.getElementById('password').value;
                const passwordConfirm = document.getElementById('password-confirm').value;
                const passwordError = document.getElementById('password-error');
                const passwordConfirmError = document.getElementById('password-confirm-error');

                if (!/^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$/.test(password)) {
                    passwordError.textContent = '비밀번호는 영문, 숫자, 특수문자 조합 8-20자로 입력해주세요.';
                    passwordError.classList.remove('hidden');
                    return;
                }

                if (password !== passwordConfirm) {
                    passwordConfirmError.textContent = '비밀번호가 일치하지 않습니다.';
                    passwordConfirmError.classList.remove('hidden');
                    return;
                }

                // 모든 검증을 통과하면 폼 제출
                this.submit();
            });
        </script>
    </th:block>
</body>
</html>
