<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title>비밀번호 찾기 - 위험안전 관리</title>
</head>
<body>
    <div layout:fragment="content" class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">비밀번호 찾기</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    가입 시 등록한 아이디와 이메일을 입력해주세요.
                </p>
            </div>
            
<!--            <form class="mt-8 space-y-6" th:action="@{${'/general/member/find-pw?constructionId=' + construction.id}}" method="POST" id="findPwForm">-->
<!--            <form class="mt-8 space-y-6" id="findPwForm">-->
                <!-- 결과 메시지 -->
<!--                <div th:if="${message1}" class="rounded-md p-4" th:classappend="${sent ? 'bg-green-50' : 'bg-red-50'}">-->
<!--                    <div class="text-sm" th:classappend="${sent ? 'text-green-700' : 'text-red-700'}" th:text="${message1}" />-->
<!--                    <div class="text-sm" th:classappend="${sent ? 'text-green-700' : 'text-red-700'}" th:text="${message2}" />-->
<!--                </div>-->
                <!-- 결과 메시지 -->
                <div id="resultMessage" class="rounded-md p-4 hidden">
                    <div id="message1" class="text-sm"></div>
                    <div id="message2" class="text-sm"></div>
                </div>

                <!-- 로딩 스피너 -->
                <div id="loadingSpinner" class="hidden">
                    <div class="flex justify-center items-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                        <div>처리중입니다.</div>
                    </div>
                </div>

                <!-- 아이디 입력 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">아이디</label>
                    <div class="mt-1">
                        <input type="text" id="username" name="username" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               placeholder="아이디를 입력해주세요">
                    </div>
                </div>

                <!-- 이메일 입력 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">이메일</label>
                    <div class="mt-1">
                        <input type="email" id="email" name="email" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               placeholder="example@email.com">
                    </div>
                </div>

                <!-- 버튼 그룹 -->
                <div class="flex justify-center space-x-4">
                    <a th:href="@{${'/general/auth/login?constructionId=' + construction.id}}"
                       class="px-6 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        취소
                    </a>
                    <button type="submit" id="submitButton"
                            class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        임시 비밀번호 발급
<!--                        비밀번호 재설정-->
                    </button>
                </div>

                <!-- 하단 링크 -->
                <div class="text-center text-sm">
                    <a th:href="@{${'/general/member/find-id?constructionId=' + construction.id}}" class="font-medium text-primary hover:text-primary-dark">
                        아이디를 찾으시나요?
                    </a>
                </div>
<!--            </form>-->

            <!-- 안내 메시지 -->
            <div class="mt-6 bg-gray-50 p-4 rounded-md">
                <h3 class="text-sm font-medium text-gray-900">임시 비밀번호 발급 안내</h3>
                <div class="mt-2 text-sm text-gray-500">
                    <ul class="list-disc pl-5 space-y-1">
                        <li>입력하신 이메일로 임시 비밀번호가 발송됩니다.</li>
                        <li>임시 비밀번호로 로그인 후 반드시 비밀번호를 변경해주세요.</li>
                        <li>이메일 수신까지 몇 분 정도 소요될 수 있습니다.</li>
                    </ul>
                </div>
<!--                <h3 class="text-sm font-medium text-gray-900">비밀번호 재설정 안내</h3>-->
<!--                <div class="mt-2 text-sm text-gray-500">-->
<!--                    <ul class="list-disc pl-5 space-y-1">-->
<!--                        <li>입력하신 이메일로 비밀번호 재설정 메일이 발송됩니다.</li>-->
<!--                        <li>메일내용의 url을 클릭 후 반드시 비밀번호를 변경해주세요.</li>-->
<!--                        <li>이메일 수신까지 몇 분 정도 소요될 수 있습니다.</li>-->
<!--                    </ul>-->
<!--                </div>-->
            </div>
        </div>

        <!-- 스크립트 추가 -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script th:inline="javascript">
            //document.getElementById('findPwForm').addEventListener('submit', async function(e) {
            document.getElementById('submitButton').addEventListener('click', async function(e) {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const constructionId = [[${construction.id}]];

                const submitButton = document.getElementById('submitButton');
                const loadingSpinner = document.getElementById('loadingSpinner');
                const resultMessage = document.getElementById('resultMessage');
                const message1Element = document.getElementById('message1');
                const message2Element = document.getElementById('message2');

                try {
                    // UI 상태 업데이트
                    submitButton.disabled = true;
                    loadingSpinner.classList.remove('hidden');
                    resultMessage.classList.add('hidden');

                    // API 호출 - headers와 Content-Type 설정 추가
                    const response = await axios.post('/general/member/async-find-pw', {
                        username: username,
                        email: email,
                        constructionId: constructionId
                    }, {
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    // 응답 처리
                    const data = response.data;
                    resultMessage.classList.remove('hidden');
                    resultMessage.classList.remove('bg-red-50', 'bg-green-50');
                    resultMessage.classList.add(data.sent ? 'bg-green-50' : 'bg-red-50');

                    message1Element.classList.remove('text-red-700', 'text-green-700');
                    message1Element.classList.add(data.sent ? 'text-green-700' : 'text-red-700');
                    message1Element.textContent = data.message1;

                    message2Element.classList.remove('text-red-700', 'text-green-700');
                    message2Element.classList.add(data.sent ? 'text-green-700' : 'text-red-700');
                    message2Element.textContent = data.message2;

                } catch (error) {
                    // 에러 처리
                    resultMessage.classList.remove('hidden');
                    resultMessage.classList.add('bg-red-50');
                    message1Element.classList.add('text-red-700');
                    message1Element.textContent = '임시 비밀번호 발급 중 오류가 발생했습니다.';
                    message2Element.textContent = '';
                    console.error('Error:', error);

                } finally {
                    // UI 상태 복원
                    submitButton.disabled = false;
                    loadingSpinner.classList.add('hidden');
                }
            });
        </script>
    </div>
</body>
</html>
