<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title>아이디 찾기 - 위험안전 관리</title>
</head>
<body>
    <div layout:fragment="content" class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">아이디 찾기</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    가입 시 등록한 이름과 이메일을 입력해주세요.
                </p>
            </div>
            
            <form class="mt-8 space-y-6" th:action="@{${'/general/member/find-id?constructionId=' + construction.id}}" method="POST" id="findIdForm">
                <!-- 결과 메시지 -->
                <div th:if="${message}" class="rounded-md p-4" th:classappend="${found ? 'bg-green-50' : 'bg-red-50'}">
                    <div class="text-sm" th:classappend="${found ? 'text-green-700' : 'text-red-700'}" th:text="${message}">
                    </div>
                </div>

                <!-- 이름 입력 -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">이름</label>
                    <div class="mt-1">
                        <input type="text" id="name" name="name" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               placeholder="이름을 입력해주세요">
                    </div>
                </div>

                <!-- 이메일 입력 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">이메일</label>
                    <div class="mt-1">
                        <input type="email" id="email" name="email" required
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               placeholder="example@email.com">
                    </div>
                </div>

                <!-- 버튼 그룹 -->
                <div class="flex justify-center space-x-4">
                    <a th:href="@{${'/general/auth/login?constructionId=' + construction.id}}"
                       class="px-6 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        취소
                    </a>
                    <button type="submit"
                            class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        아이디 찾기
                    </button>
                </div>

                <!-- 하단 링크 -->
                <div class="text-center text-sm">
                    <a th:href="@{${'/general/member/find-pw?constructionId=' + construction.id}}" class="font-medium text-primary hover:text-primary-dark">
                        비밀번호를 찾으시나요?
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
