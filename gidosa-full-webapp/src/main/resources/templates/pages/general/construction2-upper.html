<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title th:text="${construction.name + ' - 현장공사2'}"></title>
</head>
<body>
<div layout:fragment="content">
    <div class="" id="mobile1-content">
        <!-- 메인 컨테이너 -->
        <div class="flex flex-col items-center w-full max-w-md mx-auto px-4 py-4">
            <!-- 헤더 섹션 -->
            <div class="w-full bg-blue-50 rounded-lg p-4 mb-4">
                <div class="text-blue-500 text-xl font-bold">위험성평가</div>
                <div class="text-blue-900 text-2xl font-bold">자기규율 예방체계의 <span class="text-blue-500">핵심</span>입니다.</div>
            </div>

            <!-- 커스텀 메뉴 그리드 -->
            <th:block th:if="${customMenus != null && !customMenus.isEmpty()}">
                <!-- 메뉴를 3열 그리드로 표시 (한 행에 3개씩) -->
                <div class="grid grid-cols-3 gap-4 w-full mb-4" th:with="menuCount=${#lists.size(customMenus)}">
                    <th:block th:each="menu, status : ${customMenus}">
                        <div class="flex flex-col items-center border border-gray-300 rounded-lg p-4 bg-white">
                            <div class="w-10 h-10 bg-white flex items-center justify-center rounded-full mb-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </div>
                            <a th:href="@{${menu.url}}" class="text-blue-900 text-sm font-semibold text-center" th:text="${menu.name}">메뉴명</a>
                        </div>
                    </th:block>
                </div>
            </th:block>
            
            <!-- 메뉴가 없을 경우 기본 메시지 -->
            <th:block th:if="${customMenus == null || customMenus.isEmpty()}">
                <div class="w-full text-center p-4 bg-gray-100 rounded-lg mb-4">
                    <p class="text-gray-600">등록된 메뉴가 없습니다.</p>
                </div>
            </th:block>
        </div>
    </div>
    
    <div class="tailwind-section" id="pc1-content">
        <h1>데스크톱 상단 화면 - 현장공사2</h1>
    </div>
</div>
</body>
</html>
