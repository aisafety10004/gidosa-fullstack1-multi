<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title>회원가입 - 위험안전 관리</title>
</head>
<body>
    <div layout:fragment="content" class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">회원가입</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    이미 계정이 있으신가요?
                    <a th:href="@{${'/general/auth/login}" class="font-medium text-primary hover:text-primary-dark">
                        로그인
                    </a>
                </p>
            </div>

            <form class="mt-8 space-y-6" th:action="@{/general/member/register}" th:object="${memberRegisterDto}" method="POST">
                <!-- 에러 메시지 -->
                <div th:if="${errorMessage}" class="rounded-md bg-red-50 p-4">
                    <div class="text-sm text-red-700" th:text="${errorMessage}"></div>
                </div>

                <!-- 아이디 입력 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">아이디</label>
                    <div class="mt-1">
                        <input type="text" th:field="*{username}" id="username"
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               th:classappend="${#fields.hasErrors('username')} ? 'border-red-300'">
                        <p th:if="${#fields.hasErrors('username')}" class="mt-2 text-sm text-red-600" th:errors="*{username}"></p>
                    </div>
                </div>

                <!-- 비밀번호 입력 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">비밀번호</label>
                    <div class="mt-1">
                        <input type="password" th:field="*{password}" id="password"
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               th:classappend="${#fields.hasErrors('password')} ? 'border-red-300'">
                        <p th:if="${#fields.hasErrors('password')}" class="mt-2 text-sm text-red-600" th:errors="*{password}"></p>
                    </div>
                </div>

                <!-- 이름 입력 -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">이름</label>
                    <div class="mt-1">
                        <input type="text" th:field="*{name}" id="name"
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               th:classappend="${#fields.hasErrors('name')} ? 'border-red-300'">
                        <p th:if="${#fields.hasErrors('name')}" class="mt-2 text-sm text-red-600" th:errors="*{name}"></p>
                    </div>
                </div>

                <!-- 이메일 입력 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">이메일</label>
                    <div class="mt-1">
                        <input type="email" th:field="*{email}" id="email"
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                               th:classappend="${#fields.hasErrors('email')} ? 'border-red-300'">
                        <p th:if="${#fields.hasErrors('email')}" class="mt-2 text-sm text-red-600" th:errors="*{email}"></p>
                    </div>
                </div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        회원가입
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
