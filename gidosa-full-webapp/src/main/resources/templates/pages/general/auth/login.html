<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/general}">
<head>
    <title>로그인 - 위험안전 관리</title>
</head>
<body>
<div layout:fragment="content" class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div th:if="${param.error}" class="rounded-md bg-red-50 p-4">
            <div class="text-sm text-red-700">
                아이디 또는 비밀번호가 일치하지 않습니다.
            </div>
        </div>
        <div th:if="${param.registered}" class="rounded-md bg-green-50 p-4">
            <div class="text-sm text-green-700">
                회원가입이 완료되었습니다. 로그인해주세요.
            </div>
        </div>
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">로그인</h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                또는
                <a th:href="@{${'/general/member/register/agreement?constructionId=' + construction.id}}" class="font-medium text-primary hover:text-primary-dark">
                    회원가입
                </a>
            </p>
        </div>
        <form class="mt-8 space-y-6" th:action="@{/general/auth/login}" method="POST">
            <input type="hidden" name="constructionId" th:value="${construction.id}" />
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">아이디</label>
                    <input id="username" name="username" type="text" required
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                           placeholder="아이디">
                </div>
                <div>
                    <label for="password" class="sr-only">비밀번호</label>
                    <input id="password" name="password" type="password" required
                           class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                           placeholder="비밀번호">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                           class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                        아이디 저장
                    </label>
                </div>

                <div class="text-sm">
                    <a th:href="@{${'/general/member/find-id?constructionId=' + construction.id}}" class="font-medium text-primary hover:text-primary-dark">
                        아이디 찾기
                    </a>
                    <span class="text-gray-500 mx-2">|</span>
                    <a th:href="@{${'/general/member/find-pw?constructionId=' + construction.id}}" class="font-medium text-primary hover:text-primary-dark">
                        비밀번호 찾기
                    </a>
                </div>
            </div>

            <div>
                <button type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    로그인
                </button>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // 저장된 아이디가 있다면 불러오기
            const savedUsername = localStorage.getItem('savedUsername');
            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('remember-me').checked = true;
            }

            // 폼 제출 시 자동 로그인 처리
            document.querySelector('form').addEventListener('submit', function() {
                const rememberMe = document.getElementById('remember-me').checked;
                const username = document.getElementById('username').value;
                
                if (rememberMe) {
                    localStorage.setItem('savedUsername', username);
                } else {
                    localStorage.removeItem('savedUsername');
                }
            });
        });
    </script>
</th:block>
</body>
</html>
