<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>도입사례 - 바로세움</title>
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap530.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/css/bootstrap170-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/contact/example.css}">
</head>
<body>
    <div layout:fragment="content">
        <div class="search-container text-center my-5">
            <h1 class="mb-4">현장주소을 검색해 보세요</h1>
            
            <div class="search-box position-relative">
                <input type="text" class="form-control search-input" 
                       placeholder="현장주소를 넣어주세요"
                       id="mainSearch"
                       readonly>
                <i class="bi bi-search search-icon"></i>
            </div>
        </div>

        <!-- <div class="premium-section mt-5">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h2 class="mb-4">
                            현장에서<br>
                            <span class="text-primary">안전지도를 이용 중이에요</span>
                        </h2>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-4" th:each="building : ${buildings}">
                        <div class="card building-card">
                           <img th:src="${building.imageUrl}" class="card-img-top" alt="건물 이미지">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${building.name}" style="display: flex; justify-content: center; align-items: center; margin-bottom: 0px;">건물명</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div> -->

        <!-- 검색 모달 -->
        <div class="modal fade" id="searchModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0">
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="search-input-container">
                            <input type="text" class="form-control" 
                                   placeholder="현장주소를 입력하세요"
                                   id="modalSearch">
                            <i class="bi bi-search" id="searchIcon" style="cursor: pointer;"></i>
                        </div>
                        <div id="searchResults" class="mt-3">
                            <!-- 검색 결과가 여기에 표시됩니다 -->
                        </div>
                        <div class="search-info mt-4">
                            <p class="text-muted">
                                * 현장주소로 검색할 수 있어요.<br>
                                &nbsp;&nbsp;<b>(예: A현장)</b><br>
                                * 공사를 시작하지 않은 현장이거나 일부 현장의 경우 검색이 안 될 수 있어요.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <!-- Bootstrap JS -->
        <script src="/js/bootstrap530.bundle.min.js"></script>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
              // 메인 검색창 클릭 시 모달 열기
              const mainSearch = document.getElementById('mainSearch');
              const searchModal = new bootstrap.Modal(document.getElementById('searchModal'));

              // 기존의 input 이벤트 리스너를 제거하고 새로운 이벤트 리스너들을 추가
              const modalSearch = document.getElementById('modalSearch');
              const searchIcon = document.getElementById('searchIcon');
              const searchResults = document.getElementById('searchResults');

              mainSearch.addEventListener('click', function() {
                  searchModal.show();
              });
              document.getElementById('searchModal').addEventListener('shown.bs.modal', function () {
                  modalSearch.focus();
              });

              // 검색 아이콘 클릭 이벤트
              searchIcon.addEventListener('click', function() {
                  const keyword = modalSearch.value.trim();
                  if (keyword.length > 0) {
                      searchConstructions(keyword);
                  } else {
                      alert('현장주소를 입력해주세요.');
                  }
              });

              // Enter 키 이벤트
              modalSearch.addEventListener('keypress', function(e) {
                  if (e.key === 'Enter') {
                      const keyword = modalSearch.value.trim();
                      if (keyword.length > 0) {
                          searchConstructions(keyword);
                      } else {
                          alert('현장주소를 입력해주세요.');
                      }
                  }
              });

              async function searchConstructions(keyword) {
                  try {
                      const response = await fetch(`/contact/search?keyword=${encodeURIComponent(keyword)}`);
                      const data = await response.json();
                      
                      let html = `<div class="search-count mb-3">검색 결과 ${data.count}건</div>`;
                      
                      if (data.count > 0) {
                          html += '<div class="list-group">';
                          data.results.forEach(item => {
                              html += `
                                  <a href="/general/construction/${item.id}" target="${isMobile() ? '_self' : '_blank'}">
                                      <div class="list-group-item">
                                          <div class="d-flex justify-content-between align-items-center">
                                              <div>
                                                  <h6 class="mb-1">${item.location}</h6>
                                                  <small class="text-muted">${item.name}</small>
                                              </div>
                                          </div>
                                      </div>
                                  </a>
                              `;
                          });
                          html += '</div>';
                      } else {
                          html += '<div class="text-center text-muted">검색 결과가 없습니다.</div>';
                      }
                      
                      searchResults.innerHTML = html;
                  } catch (error) {
                      alert('검색 중 오류 발생\n관리자에게 문의하세요.\n\n ', error);
                      //console.error('검색 중 오류 발생:', error);
                      searchResults.innerHTML = '<div class="text-danger">검색 중 오류가 발생했습니다.</div>';
                  }
              }
            });
        </script>
    </th:block>
</body>
</html>
