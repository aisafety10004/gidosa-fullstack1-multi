<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>우리집을 검색해 보세요</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/contact/example.css}">
</head>
<body>
    <div layout:fragment="content">
        <div class="search-container text-center my-5">
            <h1 class="mb-4">우리집을 검색해 보세요</h1>
            
            <div class="search-box position-relative">
                <input type="text" class="form-control search-input" 
                       placeholder="반포동 홈노크타운" 
                       id="mainSearch"
                       readonly>
                <i class="bi bi-search search-icon"></i>
            </div>
        </div>

        <div class="premium-section mt-5">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <h2 class="mb-4">
                            건설공사현장에서<br>
                            <span class="text-primary">안전지도를 이용 중이에요</span>
                        </h2>
                    </div>
                </div>
                <div class="row">
                    <!-- 건물 카드들 -->
                    <div class="col-md-4 mb-4" th:each="building : ${buildings}">
                        <div class="card building-card">
<!--                            <img th:src="${building.imageUrl}" class="card-img-top" alt="건물 이미지">-->
                            <div class="card-body">
                                <h5 class="card-title" th:text="${building.name}" style="display: flex; justify-content: center; align-items: center; margin-bottom: 0px;">건물명</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 검색 모달 -->
        <div class="modal fade" id="searchModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0">
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="search-input-container">
                            <input type="text" class="form-control" 
                                   placeholder="건설공사현장 이름를 입력하세요"
                                   id="modalSearch">
                            <i class="bi bi-search"></i>
                        </div>
                        <div class="search-info mt-4">
                            <p class="text-muted">
                                * 건설공사현장 이름으로 검색할 수 있어요.(예: 자이반포 공사)<br>
                                * 건설공사를 시작하지 않은 현장이거나 일부 건설공사현장의 경우 검색이 안 될 수 있어요.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="script">
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
              // 메인 검색창 클릭 시 모달 열기
              const mainSearch = document.getElementById('mainSearch');
              const searchModal = new bootstrap.Modal(document.getElementById('searchModal'));

              mainSearch.addEventListener('click', function() {
                  searchModal.show();
              });

              // 모달 내 검색 기능
              const modalSearch = document.getElementById('modalSearch');
              modalSearch.addEventListener('input', function(e) {
                  // TODO: 검색 로직 구현
                  console.log('Searching for:', e.target.value);
              });
            });
        </script>
    </th:block>
</body>
</html>
