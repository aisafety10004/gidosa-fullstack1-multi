<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>도입 문의 - Gidosa</title>
    <link rel="stylesheet" th:href="@{/css/contact/request-site.css}">
</head>
<body>
    <div layout:fragment="content">
        <section class="contact-section">
            <div class="contact-header">
                <h1>도입 상담 정보를<br>남겨주세요</h1>
                <p class="subtitle">평균 2일 내<br>전문 매니저가 연락드려요.</p>
            </div>

            <div class="contact-form">
                <form th:action="@{/contact/submit}" method="post">
                    <div class="form-group">
                        <label for="name">이름<span class="required">*</span></label>
                        <input type="text" id="name" name="name" required
                               placeholder="고객님의 성함을 입력해 주세요.">
                    </div>

                    <div class="form-group">
                        <label for="phone">전화번호<span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" required
                               placeholder="전화번호를 입력해 주세요.">
                    </div>

                    <div class="form-group">
                        <label for="churchName">건설공사현장 또는 주소<span class="required">*</span></label>
                        <input type="text" id="churchName" name="churchName" required
                               placeholder="건설공사현장 또는 주소를 입력해 주세요.">
                    </div>

                    <div class="form-group">
                        <label for="position">소속<span class="required">*</span></label>
                        <select id="position" name="position" required>
                            <option value="">고객님의 소속을 선택해 주세요.</option>
                            <option value="PASTOR">일반 관리자</option>
                            <option value="ELDER">특수 관리자</option>
                            <option value="DEACON">안전사</option>
                            <option value="OTHER">기타</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">도입 내용</label>
                        <textarea id="message" name="message" rows="4"
                                placeholder="도입을 원하는 서비스를 입력해 주세요."></textarea>
                    </div>

                    <div class="form-group checkbox">
                        <input type="checkbox" id="agreement" name="agreement" required>
                        <label for="agreement">
                            [필수] 개인정보 수집 및 이용에 동의해요. 상담 외 다른 목적으로 사용되지 않아요.
                        </label>
                    </div>

                    <button type="submit" class="submit-button">도입 신청하기</button>
                </form>
            </div>

            <div class="process-section">
                <h2>도입은 어떻게 이루어지나요?</h2>
                <div class="process-steps">
                    <div class="step">
                        <span class="step-number">1</span>
                        <h3>도입 문의</h3>
                        <p>이름, 전화번호, 건설공사현장 등 도입하고자 하는 분의 상담 정보를 남겨주세요.</p>
                    </div>
                    <div class="step">
                        <span class="step-number">2</span>
                        <h3>전문가 상담</h3>
                        <p>평균 2일 내 남겨주신 전화번호로 연락드리고 건설공사현장에 맞는 최적의 솔루션을 제안드려요.</p>
                    </div>
                    <div class="step">
                        <span class="step-number">3</span>
                        <h3>맞춤형 기능 체험</h3>
                        <p>건설공사현장 규모와 관계없이 다양한 기능을 체험해보고 계약을 진행할 수 있어요.</p>
                    </div>
<!--                    <div class="step">-->
<!--                        <span class="step-number">4</span>-->
<!--                        <h3>건설공사현장 도입 완료</h3>-->
<!--                        <p>전담 팀 구성을 통해 지속적으로 기술 지원을 해드려요.</p>-->
<!--                    </div>-->
                </div>
            </div>
        </section>
    </div>
</body>
</html>
