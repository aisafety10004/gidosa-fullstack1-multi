<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - 건설공사현장"> </title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/icons/favicon.ico}" />
    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<!--    <link rel="stylesheet" th:href="@{/css/tailwind.css}">-->
    <!-- Page specific CSS -->
    <th:block layout:fragment="css"></th:block>

    <script src="/js/tailwindcss.js"></script>
</head>
<body>
    <!-- Header/Navigation -->
    <div th:replace="~{fragments/header-general :: header}"></div>
    <!-- Header Sub/Navigation -->
    <div th:replace="~{fragments/header-general-sub :: header-sub}"></div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 pt-24">
        <div layout:fragment="content">
            <!-- Page content will be inserted here -->
        </div>
    </main>

    <!-- Footer -->
<!--    <div th:replace="~{fragments/footer-general :: footer}"></div>-->

    <!-- Common JavaScript -->
    <script th:src="@{/js/main.js}"></script>

    <!-- Page specific JavaScript -->
    <th:block layout:fragment="script"></th:block>
</body>
</html>
