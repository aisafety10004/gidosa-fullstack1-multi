<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-title" content="BAROCEUM" />
    <title layout:title-pattern="$CONTENT_TITLE - 공사현장"> </title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/icons/favicon.ico}" />
    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<!--    <link rel="stylesheet" th:href="@{/css/tailwind.css}">-->
    <!-- PWA 관련 -->
    <link rel="manifest" id="my-manifest-placeholder">
    <!-- <link rel="manifest" href="/manifest3.json"> -->
    <!-- <link rel="manifest" href="/manifest.json"> -->
<!--    <link rel="manifest" href="/manifest.json?constructionId=1&version=1.0.0">-->
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/images/baroceum_app_192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/baroceum_app_512x512.png" />
    <!-- Swiper10 스타일 및 스크립트 -->
    <link rel="stylesheet" href="/css/swiper10-bundle.min.css" />
    <!-- Page specific CSS -->
    <th:block layout:fragment="css">
        <style>
            /* 모바일 화면에서 서브(sub)헤더 숨기기 (508px 미만에서 적용) */
            @media (max-width: 507px) {
                #mobile1-content {
                    display: block !important;
                }
                header.header-sub {
                    display: none !important;
                }

                #pc1-content {
                    display: none !important;
                }
                /* main {
                    background-color: #DAE4FA;
                } */    

                #mobile1-footer {
                    display: block;
                }
            }
            /* 데스크탑 화면(508px 이상) */
            @media (min-width: 508px) {
                #pc1-content {
                    display: none !important;
                }
                /* #mobile1-content {
                    display: none !important;
                }
                header.header-sub {
                    display: block !important;
                }

                #pc1-content {
                    display: block !important;
                }
                main {
                    background-color: white;
                }

                #mobile1-footer {
                    display: none !important;
                } */
            }
        </style>
    </th:block>

    <script src="/js/tailwindcss.js"></script>
    <script src="/js/swiper10-bundle.min.js"></script>
    <script src="/js/firebase-app-compat961.js"></script>
    <script src="/js/firebase-messaging-compat961.js"></script>
    <script>
        
    </script>
</head>
<body class="bg-[#DAE4FA] flex flex-col min-h-screen">
    <script th:src="@{/js/common.js}"></script>

    <!-- Header/Navigation -->
    <div th:replace="~{fragments/header-general3 :: header}"></div>
    <!-- Header Sub/Navigation -->
    <!-- <div th:replace="~{fragments/header-general-sub :: header-sub}"></div> -->

    <!-- Main Content -->
    <main class="w-full pt-24 flex-grow">
        <div layout:fragment="content" class="container mx-auto">
            <!-- Page content will be inserted here -->
        </div>
    </main>

    <!-- Bottom Button Section -->
    <div layout:fragment="bottom-button">
        <!-- Bottom button content will be inserted here -->
    </div>

    <!-- Footer Sub -->
    <div th:replace="~{fragments/footer-general-sub :: footer-sub(construction=${construction})}"></div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer-general :: footer(construction=${construction})}"></div>

    <!-- Main JavaScript -->
    <script th:src="@{/js/main.js}"></script>

    <!-- Page specific JavaScript -->
    <th:block layout:fragment="script"></th:block>
</body>
</html>
