<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.springframework.org/security/tags"
>
<header th:fragment="header" class="w-full fixed top-0 z-50" th:if="${headerInvisible == null || !headerInvisible}">
    <nav class="flex items-center justify-between px-8 py-4 bg-white w-full"
         th:classappend="${headerInvisible ?: 'bg-gray-500/50'}"
         th:with="authConstruction=${construction == null ? #authentication.principal.memberGeneral.construction : construction}">
        <div class="flex items-center">
            <a th:href="@{${#authorization.expression('isAuthenticated()') ? '/general/main/main' : '/general/construction/' + construction.id}}"
               class="text-lg md:text-2xl font-bold text-primary focus:outline-none" style="width: 96px;"
               onclick="if (headerInvisible) return false;">
                공사현장
            </a>
            <th:block th:if="${authConstruction != null || construction != null}">
                <span class="mx-2 md:mx-4 text-gray-300">|</span>
                <a th:href="@{${#authorization.expression('isAuthenticated()') ? '/general/main/main' : '/general/construction/' + construction.id}}"
                   class="text-base md:text-xl text-gray-700 cursor-pointer"
                   onclick="if (headerInvisible) return false;"
                   th:text="${authConstruction != null ? authConstruction.location : construction.location}"
                >
                </a>
            </th:block>
        </div>

        <!-- 햄버거 버튼과 X 버튼 -->
        <th:block th:if="${showCloseButton}">
            <a th:href="@{${'/general/auth/login?constructionId=' + (authConstruction != null ? authConstruction.id : construction.id)}}"
               class="w-10 h-10 flex items-center justify-center rounded-lg bg-white text-black">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <path d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </a>
        </th:block>
        <th:block th:unless="${showCloseButton}">
            <button class="relative w-10 h-10 md:hidden bg-white rounded-lg transition-colors duration-200 focus:outline-none"
                    th:classappend="${headerInvisible ?: 'bg-gray-500/50'}"
                    onclick="toggleMenu()">
                <div class="absolute inset-0 flex flex-col items-center justify-center gap-[6px]">
                        <span class="w-6 h-[2px] bg-gray-700 transition-transform duration-300"
                              id="hamburger-top"></span>
                    <span class="w-6 h-[2px] bg-gray-700 transition-opacity duration-300"
                          id="hamburger-middle"></span>
                    <span class="w-6 h-[2px] bg-gray-700 transition-transform duration-300"
                          id="hamburger-bottom"></span>
                </div>
            </button>
        </th:block>

        <!-- 데스크탑 네비게이션 링크 -->
        <th:block th:unless="${showCloseButton}">
            <div class="hidden md:flex md:items-center md:gap-1">
                <a href="#"
                   class="px-6 py-2 text-black rounded-md hover:bg-primaryDark transition-colors duration-300 focus:outline-none"
                   th:classappend="${headerInvisible != null and headerInvisible == true ? 'bg-gray-500/50 pointer-events-none' : ''}"
                   onclick="javascript:alert('개발중입니다.'); return false;">
                    검색
                </a>
                <!-- 로그인 상태에 따라 다른 메뉴 표시 -->
                <th:block sec:authorize="!isAuthenticated()">
                    <a th:href="@{${'/general/auth/login?constructionId=' + construction.id}}"
                       class="px-6 py-2 text-black rounded-md hover:bg-primaryDark transition-colors duration-300 focus:outline-none"
                       th:classappend="${headerInvisible != null and headerInvisible == true ? 'bg-gray-500/50 pointer-events-none' : ''}"
                       onclick="if (headerInvisible) return false;">
                        회원가입/로그인
                    </a>
                </th:block>
                <th:block sec:authorize="isAuthenticated()">
                    <!-- 마이페이지 드롭다운 추가 -->
                    <div class="relative group">
                        <button class="px-6 py-2 text-black rounded-md hover:bg-primaryDark transition-colors duration-300 focus:outline-none"
                                th:classappend="${headerInvisible != null and headerInvisible == true ? 'bg-gray-500/50 pointer-events-none' : ''}">
                            마이페이지
                        </button>
                        <!-- padding-top을 2로 설정하고, 메뉴 위에 투명한 영역 추가 -->
                        <div class="absolute right-0 w-48 pt-2">
                            <!-- 투명한 영역으로 간격 채우기 -->
                            <div class="h-2"></div>
                            <div class="bg-white rounded-md shadow-lg hidden group-hover:block z-50">
                                <a th:href="@{/general/mypage/profile}"
                                   class="block px-4 py-2 text-sm text-gray-700 hover:bg-primaryDark hover:text-black">
                                    개인정보 수정
                                </a>
                                <a href="#"
                                   class="block px-4 py-2 text-sm text-gray-700 hover:bg-primaryDark hover:text-black">
                                    서브메뉴2
                                </a>
                            </div>
                        </div>
                    </div>
                    <form th:action="@{/general/auth/logout}" method="post" style="display: inline;">
                        <button type="submit" 
                                class="px-6 py-2 text-black rounded-md hover:bg-primaryDark transition-colors duration-300 focus:outline-none"
                                th:classappend="${headerInvisible != null and headerInvisible == true ? 'bg-gray-500/50 pointer-events-none' : ''}"
                                onclick="if (headerInvisible) return false;">
                            로그아웃
                        </button>
                    </form>
                </th:block>
            </div>
        </th:block>
    </nav>

    <!-- 모바일 드롭다운 메뉴 -->
    <div id="mobile-menu" class="md:hidden absolute w-full bg-white shadow-lg z-50 hidden">
        <div class="flex flex-col py-2">
            <a href="#"
               class="mx-8 my-3 px-6 py-2 text-black rounded-md hover:bg-primaryDark text-center focus:outline-none"
               onclick="javascript:alert('개발중입니다.'); return false;">
                검색
            </a>
            <!-- 로그인 상태에 따라 다른 메뉴 표시 -->
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{${'/general/auth/login?constructionId=' + construction.id}}"
                   class="mx-8 my-3 px-6 py-2 text-black rounded-md hover:bg-primaryDark text-center focus:outline-none"
                   onclick="closeMenu()">
                    회원가입/로그인
                </a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/general/mypage/profile}"
                   class="mx-8 my-3 px-6 py-2 text-black rounded-md hover:bg-primaryDark text-center focus:outline-none"
                   onclick="closeMenu()">
                    개인정보 수정
                </a>
                <form th:action="@{/general/auth/logout}" method="post" style="display: inline;">
                    <button type="submit" 
                            class="w-full my-3 px-6 py-2 text-black rounded-md hover:bg-primaryDark text-center focus:outline-none"
                            onclick="closeMenu()">
                        로그아웃
                    </button>
                </form>
            </th:block>
        </div>
    </div>
</header>
