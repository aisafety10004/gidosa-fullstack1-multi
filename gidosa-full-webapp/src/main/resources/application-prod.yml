# 서버포트
server:
  port: 9097
  #  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false   # 스프링 기본 에러 페이지 비활성화
    path: /error       # 에러 발생시 이동할 경로

# spring-web-jpa
spring:
  application:
    name: gidosa-full-webapp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:
    username:
    password:
    hikari:
      maximum-pool-size: 20

  thymeleaf:          # 타임리프
    cache: false
#    prefix: classpath:/templates/
#    suffix: .html
#    view-names: thymeleaf/*
#    enabled: true
#    check-template-location: true

  mvc:
    #    static-path-pattern: /**
    view:         # 제이에스피
      prefix: /WEB-INF/views/
      suffix: .jsp

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
#    context-path: /api

  jpa:
    hibernate:
      ddl-auto: none
    #    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        dialect: org.hibernate.dialect.MySQLDialect
#        format_sql: true
    open-in-view: false
    jwt:
      secret:

# mybatis
mybatis:
#  mapper-locations: classpath:mappers/**/*.xml
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: net.gidosa.full.webapp.mappers
#  configuration:
#    map-underscore-to-camel-case: true

# log