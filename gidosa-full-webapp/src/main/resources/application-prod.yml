# 서버포트
server:
  port: 9097
  #  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false   # 스프링 기본 에러 페이지 비활성화
    include-exception: true
#    include-stacktrace: always
    path: /error       # 에러 발생시 이동할 경로

# spring-web-jpa
spring:
  application:
    name: gidosa-full-webapp

  datasource:
    mysql:
      master1:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url:
        username:
        password:
        max-pool-size: 20

  thymeleaf:          # 타임리프
    cache: false
#    prefix: classpath:/templates/
#    suffix: .html
#    view-names: thymeleaf/*
#    enabled: true
#    check-template-location: true

  mvc:
    #    static-path-pattern: /**
    view:         # 제이에스피
      prefix: /WEB-INF/views/
      suffix: .jsp

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
#    context-path: /api
    session:
      timeout: 30m  # 세션 타임아웃 설정
      cookie:
        http-only: true
        secure: true  # HTTPS 사용하므로 true로 설정

  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: none        # ddl-auto와 같음
        show_sql: true      # java코드로 짠 sql을
        format_sql: true    # sql문 pretty하게 보여줌
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Seoul
        #        dialect: org.hibernate.dialect.PostgreSQLDialect
        #        temp:
        #          use_jdbc_metadata_defaults: false
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        enable_lazy_load_no_trans: false  # open-in-view 비슷?
        #        default_schema: users
        #        transaction:
        #          jta:   # Java Tomcat Application? or Java Transaction API?
        #            platform: true
        query:
          fail_on_pagination_over_collection_fetch: true
    #        default_batch_fetch_size: 500

jwt:
  secret:

