plugins {
//    id 'java-library'
    id 'java-test-fixtures'
//    id 'maven-publish'
}

bootJar {
    enabled = false
    archiveFileName = 'gidosa-rdb.jar'
}

jar {
    enabled = true
}

test {
    enabled = false
}
//tasks.bootJar { enabled = false }
//tasks.jar { enabled = false }

dependencies {
    implementation project(path: ':gidosa-common')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
//    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.mysql:mysql-connector-j'
//    implementation 'com.vladmihalcea:hibernate-types-52:2.21.1'     // postgres data type support??(json type)
    implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'
//    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.3'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-60:3.5.1'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation "com.fasterxml.jackson.core:jackson-databind"

    // log4j(query log)
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
//
//    // Spring boot 3.x이상 QueryDsl 사용
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    implementation 'com.querydsl:querydsl-core:5.0.0'
    implementation 'com.querydsl:querydsl-collections:5.0.0'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.modelmapper:modelmapper:3.2.0'
//    implementation 'net.gpedro.integrations.slack:slack-webhook:1.4.0'

    testImplementation project(path: ':gidosa-common')
//    testImplementation(testFixtures(project(":gidosa-rdb")))

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
//    testImplementation group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
//    testImplementation group: 'org.assertj', name: 'assertj-core'

//     testFixture
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'

//    testImplementation platform('org.junit:junit-bom:5.9.1')
//    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// Querydsl 설정부
def querydslDir = "$buildDir/generated/querydsl"
//def querydslDir = 'src/main/generated'

// querydsl QClass 파일 생성 위치를 지정
tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

// java source set 에 querydsl QClass 위치 추가
sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

// gradle clean 시에 QClass 디렉토리 삭제
clean.doLast {
    file(querydslDir).deleteDir()
}
