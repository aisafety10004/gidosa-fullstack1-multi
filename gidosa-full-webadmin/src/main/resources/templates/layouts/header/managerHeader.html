<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title th:utext="${#authentication.principal.memberAdmin.location}"></title>

  <link rel="icon" type="image/x-icon" th:href="@{/assets/icons/favicon.ico}" />
  <link th:href="@{/css/styles.css}" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/bootstrap-icons/bootstrap-icons.min.css}">
  <!-- Toast UI Editor CSS -->
  <link rel="stylesheet" th:href="@{/css/toastui/toastui-editor.min.css}" />
  <link rel="stylesheet" th:href="@{/css/toastui/toastui-editor-dark.min.css}" />

  <script src="/vendor/jquery/jquery.min.js"></script>
  <!-- Toast UI Editor JS -->
  <script th:src="@{/js/toastui/toastui-editor-all.min.js}"></script>
  <!-- Manager Header CSS -->
  <link rel="stylesheet" th:href="@{/css/header.css}" />

  <script th:src="@{/js/tailwind/tailwindcss.js}"></script>
  <script>
    tailwind.config = {
      // prefix: 'tw-', // 모든 타일윈드 클래스에 'tw-' 프리픽스 추가(ex) class="bg-blue-500" → class="tw-bg-blue-500", class="text-white" → class="tw-text-white")
      // important: true, // 타일윈드 스타일에 !important 추가 (필요한 경우)
      important: '.tailwind-section', // tailwind-section 안에서만 타일윈드 스타일 우선 적용
      corePlugins: {
        preflight: false, // 기본 스타일 초기화 비활성화
        container: false, // 타일윈드 컨테이너 유틸리티 비활성화
      }
    }
  </script>

  <style>
    /* 고정 헤더 높이만큼 컨텐츠 영역에 패딩 추가 */
    #page-content-wrapper {
      padding-top: 82px;
    }
  </style>
</head>

<body class="">
  <!-- 헤더 시작 -->
  <header class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container position-relative">

      <!-- 로고 -->
      <a class="navbar-brand" href="/main">
        <span sec:authorize="isAuthenticated()" th:utext="${#authentication.principal.memberAdmin.location}" />
      </a>

      <!-- 네비게이션 메뉴 -->
      <div class="collapse navbar-collapse gap-4" id="navbarNav">
        <!-- 로그인한 사용자만 볼 수 있는 메뉴 -->
        <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
          <!-- 회원관리 -->
          <li class="nav-item">
            <a class="nav-link" href="/member/general/list">회원관리</a>
          </li>

          <!-- 의견제출 -->
          <li class="nav-item">
            <a class="nav-link" href="/inquiry/list">의견제출</a>
          </li>

          <!-- 공지사항 -->
          <li class="nav-item">
            <a class="nav-link" href="/notice">공지사항</a>
          </li>

          <!-- 공정관리 드롭다운 -->
          <li class="nav-item dropdown"
            th:if="${#arrays.contains(#authentication.principal.memberAdmin.construction.managementMenus, '공정관리')}">
            <a class="nav-link dropdown-toggle" href="#" id="processDropdown" role="button" data-bs-toggle="dropdown">
              공정관리
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/process/work-discussion">업무등록</a></li>
            </ul>
          </li>

          <!-- 품질관리 드롭다운 -->
          <li class="nav-item dropdown"
            th:if="${#arrays.contains(#authentication.principal.memberAdmin.construction.managementMenus, '품질관리')}">
            <a class="nav-link dropdown-toggle" href="#" id="qualityDropdown" role="button" data-bs-toggle="dropdown">
              품질관리
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/quality/sub1">서브메뉴 1</a></li>
              <li><a class="dropdown-item" href="/quality/sub2">서브메뉴 2</a></li>
            </ul>
          </li>

          <!-- 안전관리 드롭다운 -->
          <li class="nav-item dropdown"
            th:if="${#arrays.contains(#authentication.principal.memberAdmin.construction.managementMenus, '안전관리')}">
            <a class="nav-link dropdown-toggle" href="#" id="safetyDropdown" role="button" data-bs-toggle="dropdown">
              안전관리
            </a>
            <ul class="dropdown-menu">
              <li class="dropdown-submenu">
                <a class="dropdown-item dropdown-toggle" href="#">위험요인관리</a>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item" href="/safety/risk-factor/list">모바일용</a></li>
                  <li><a class="dropdown-item" href="/safety/risk-factor/list-pc">데스크탑용</a></li>
                </ul>
              </li>
            </ul>
          </li>

          <!-- 확장메뉴 드롭다운 -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="settingsDropdown" role="button" data-bs-toggle="dropdown">
              확장메뉴
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/settings/menu-manager">메뉴설정</a></li>
              <li><a class="dropdown-item" href="/settings/html-manager">페이지 관리</a></li>
              <!-- 커스텀 메뉴 섹션 -->
              <th:block
                th:if="${@customMenuService.getRootMenusWithChildrenByConstructionId(#authentication.principal.memberAdmin.construction.id) != null}">
                <th:block
                  th:each="rootMenu : ${@customMenuService.getRootMenusWithChildrenByConstructionId(#authentication.principal.memberAdmin.construction.id)}">
                  <th:block th:if="${rootMenu.isActive}">
                    <th:block th:if="${!rootMenu.children.isEmpty()}">
                      <li class="dropdown-submenu">
                        <a class="dropdown-item dropdown-toggle" th:href="'#'" th:text="${rootMenu.name}"></a>
                        <ul class="dropdown-menu dropdown-menu-end">
                          <li th:each="childMenu : ${rootMenu.children}" th:if="${childMenu.isActive}">
                            <a class="dropdown-item" th:href="${childMenu.url}" th:text="${childMenu.name}"></a>
                          </li>
                        </ul>
                      </li>
                    </th:block>
                    <th:block th:if="${rootMenu.children.isEmpty()}">
                      <li><a class="dropdown-item" th:href="${rootMenu.url}" th:text="${rootMenu.name}"></a></li>
                    </th:block>
                  </th:block>
                </th:block>
              </th:block>
            </ul>
          </li>

          <!-- ERP -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="erpDropdown" role="button"
              data-bs-toggle="dropdown">ERP</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/erp/attendance">근퇴 관리</a></li>
              <li><a class="dropdown-item" href="/erp/hrManagement">인사관리</a></li>
              <li><a class="dropdown-item" href="/erp/project">프로젝트/WBS</a></li>
              <li><a class="dropdown-item" href="/erp/approval">전자결제</a></li>
              <li><a class="dropdown-item" href="/erp/salary">급여고과</a></li>
            </ul>
          </li>
        </ul>

        <!-- 로그아웃 버튼 -->
        <div class="nav-item" sec:authorize="isAuthenticated()">
          <form th:action="@{/auth/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-link logout-link p-0">Logout</button>
          </form>
        </div>
      </div>
    </div>
  </header>
  <!-- 헤더 끝 -->

  <!-- 메인 컨텐츠 영역 -->
  <main id="page-content-wrapper" th:class="${url.startsWith('/erp')} ? '' : 'container'">
    <div layout:fragment="content"></div>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <!-- Core theme JS-->
  <script th:src="@{/js/scripts.js}"></script>
  <!-- 드롭다운 스크립트 -->
  <script th:src="@{/js/dropdown.js}"></script>
  <th:block layout:fragment="script"></th:block>
</body>

</html>
