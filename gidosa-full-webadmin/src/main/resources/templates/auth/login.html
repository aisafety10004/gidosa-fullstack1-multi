<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<!--layout:decorate="~{${layout}}"-->
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <!-- <title>안전지도사 관리자 어드민</title> -->
    <title>바로세움</title>
    <!-- Custom styles for this template-->
<!--    <link th:href="@{../css/sb-admin-2.min.css}" rel="stylesheet">-->
<!--    <link th:href="@{../css/sb-admin-2.css}" rel="stylesheet">-->
    <link th:href="@{/css/sb-admin-2.css}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
<div class="container">
    <!-- Outer Row -->
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
<!--                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>-->
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <!-- <h1 class="h4 text-gray-900 mb-4">안전지도사 관리자 페이지</h1> -->
                                    <h1 class="h4 text-gray-900 mb-4">관리자 로그인</h1>
                                </div>
                                <form class="user" th:action="@{/auth/login}" method="post">
                                    <div class="form-group">
                                        <input type="text" class="form-control form-control-user"
                                               id="username" name="username" 
                                               placeholder="Username">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user"
                                               id="password" name="password" 
                                               placeholder="Password">
                                    </div>
                                    <div class="form-group">
                                        <div class="custom-control custom-checkbox small">
                                            <input type="checkbox" class="custom-control-input" 
                                                   id="id-save">
                                            <label class="custom-control-label" for="id-save">아이디 저장</label>
                                        </div>
<!--                                        <div class="custom-control custom-checkbox small">-->
<!--                                            <input type="checkbox" class="custom-control-input"-->
<!--                                                   id="remember-me" name="remember-me">-->
<!--                                            <label class="custom-control-label" for="remember-me">자동 로그인</label>-->
<!--                                        </div>-->
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        Login
                                    </button>

                                    <!-- 로그인 실패 메시지 표시 -->
                                    <div th:if="${param.error}" class="alert alert-danger mt-3">
                                        <small>Invalid username or password.</small>
                                    </div>
                                    <div th:if="${param.logout}" class="alert alert-info mt-3">
                                        <small>You have been logged out.</small>
                                    </div>
                                </form>
<!--                                <hr>-->
<!--                                <div class="text-center">-->
<!--                                    <a class="small" href="/auth/forgot-password">Forgot Password?</a>-->
<!--                                </div>-->
<!--                                <div class="text-center">-->
<!--                                    <a class="small" href="register.html">Create an Account!</a>-->
<!--                                </div>-->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.js"></script>
<!-- Remember Me 기능을 위한 스크립트 -->
<script src="/js/login.js"></script>

</body>
</html>
