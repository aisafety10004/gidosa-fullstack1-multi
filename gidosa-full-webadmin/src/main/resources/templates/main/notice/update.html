<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>공지사항 수정</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">공지사항 수정</h2>

        <form th:action="@{/notice/update/{id}(id=${notice.id})}" method="post" 
              enctype="multipart/form-data" onsubmit="return submitForm()">
            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" class="form-control" id="title" name="title" 
                       th:value="${notice.title}" required>
            </div>
            <div class="mb-3">
                <label for="editor" class="form-label">내용</label>
                <div id="editor"></div>
                <input type="hidden" id="content" name="content">
            </div>

            <!-- 기존 첨부파일 목록 -->
            <div class="mb-3" th:if="${!notice.attachments.empty}">
                <label class="form-label">기존 첨부파일</label>
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center" 
                        th:each="attachment : ${notice.attachments}">
                        <span>
                            <a th:href="@{/common/file/download/{id}(id=${attachment.id})}"
                               th:text="${attachment.originalFilename}"></a>
                            (<span th:text="${#numbers.formatDecimal(attachment.fileSize/1024, 0, 'COMMA', 2, 'POINT')}">
                            </span> KB)
                        </span>
                        <button type="button" class="btn btn-danger btn-sm"
                                th:onclick="'deleteAttachment(' + ${attachment.id} + ')'">삭제</button>
                    </li>
                </ul>
            </div>

            <!-- 새로운 첨부파일 추가 -->
            <div class="mb-3">
                <label for="files" class="form-label">새 첨부파일 추가 (최대 5개)</label>
                <input type="file" class="form-control" id="files" name="files" 
                       multiple accept="*/*" onchange="validateFiles(this)">
                <small class="text-muted">파일은 최대 5개까지 첨부 가능합니다.(Ctrl + 클릭 시 여러 파일 선택 가능)</small>
            </div>

            <button type="submit" class="btn btn-primary">수정</button>
            <a th:href="@{/notice/detail/{id}(id=${notice.id})}" class="btn btn-secondary">취소</a>
        </form>
    </div>

    <th:block layout:fragment="script">
    <script th:inline="javascript">
        const initialContent = /*[[${notice.content}]]*/ '';
        const editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '500px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            initialValue: initialContent
        });

        function submitForm() {
            const content = editor.getMarkdown();
            document.getElementById('content').value = content;
            
            // 파일 input의 값이 비어있으면 disabled 처리
            const fileInput = document.getElementById('files');
            if (fileInput.files.length === 0) {
                fileInput.disabled = true;
            }
            
            return true;
        }

        function validateFiles(input) {
            const currentAttachments = /*[[${notice.attachments.size()}]]*/ 0;
            const maxFiles = 5 - currentAttachments;
            
            if (input.files.length > maxFiles) {
                alert('첨부파일은 최대 ' + maxFiles + '개까지만 추가 가능합니다.');
                input.value = '';
                return false;
            }
            return true;
        }

        function deleteAttachment(attachmentId) {
            if (confirm('첨부파일을 삭제하시겠습니까?')) {
                const noticeId = /*[[${notice.id}]]*/ '';
                const csrfToken = document.querySelector('meta[name="_csrf"]').content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

                fetch(`/notice/attachment/${noticeId}/${attachmentId}/delete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => {
                            throw new Error(text || '첨부파일 삭제 중 오류가 발생했습니다.');
                        });
                    }
                    return response;
                })
                .then(() => {
                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert(error.message || '첨부파일 삭제 중 오류가 발생했습니다.');
                });
            }
        }
    </script>
    </th:block>
</body>
</html>
