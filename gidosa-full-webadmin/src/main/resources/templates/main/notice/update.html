<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>공지사항 수정</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">공지사항 수정</h2>

        <form th:action="@{/notice/update/{id}(id=${notice.id})}" method="post" 
              enctype="multipart/form-data" onsubmit="return submitForm()">
            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" class="form-control" id="title" name="title" 
                       th:value="${notice.title}" required>
            </div>
            <div class="mb-3">
                <label for="noticeDate" class="form-label">공지일자</label>
                <input type="datetime-local" class="form-control" id="noticeDate" name="noticeDate"
                       th:value="${#temporals.format(notice.noticeDate, 'yyyy-MM-dd''T''HH:mm')}" required>
            </div>
            
            <!-- 관리자인 경우 건설현장 선택 드롭다운 표시 -->
            <div class="mb-3" th:if="${isAdmin}">
                <label for="constructionId" class="form-label">건설현장</label>
                <select class="form-select" id="constructionId" name="constructionId">
                    <option value="">전체 공지사항 (모든 사용자에게 표시)</option>
                    <option th:each="construction : ${constructions}"
                            th:value="${construction.id}"
                            th:text="${construction.name + ' (' + construction.location + ')'}"
                            th:selected="${notice.construction != null && notice.construction.id == construction.id}">
                    </option>
                </select>
                <small class="text-muted">건설현장을 선택하지 않으면 모든 사용자에게 공지사항이 표시됩니다.</small>
            </div>
            
            <!-- 매니저인 경우 자신의 건설현장 정보 표시 -->
            <div class="mb-3" th:if="${!isAdmin && notice.construction != null}">
                <label class="form-label">건설현장</label>
                <p class="form-control-static" th:text="${notice.construction.name + ' (' + notice.construction.location + ')'}"></p>
                <small class="text-muted">해당 건설현장에 속한 사용자들에게만 공지사항이 표시됩니다.</small>
            </div>
            
            <div class="mb-3">
                <label for="editor" class="form-label">내용</label>
                <div id="editor"></div>
                <input type="hidden" id="content" name="content">
            </div>

            <div class="mb-3">
                <h2>Mermaid 코드 입력</h2>
                <textarea id="mermaid-input" name="mermaidCode" placeholder="Mermaid 코드를 입력하세요." cols="100" rows="10" style="resize: both;" th:text="${notice.mermaidCode}"></textarea>
                <h3>Mermaid 다이어그램 미리보기</h3>
                <div id="mermaid-preview" class="preview-box"></div>
            </div>

            <!-- 기존 첨부파일 목록 -->
            <div class="mb-3" th:if="${!notice.attachments.empty}">
                <label class="form-label">기존 첨부파일</label>
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center" 
                        th:each="attachment, status : ${notice.attachments}">
                        <span>
                            <a th:href="@{/common/file/download/{id}(id=${attachment.id})}"
                               th:text="${attachment.originalFilename}"></a>
                            (<span th:text="${#numbers.formatDecimal(attachment.fileSize/1024, 0, 'COMMA', 2, 'POINT')}">
                            </span> KB)
                        </span>
                        <form th:action="@{/notice/attachment/{noticeId}/remove/{attachmentIndex}(noticeId=${notice.id}, attachmentIndex=${status.index + 1})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('첨부파일을 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </li>
                </ul>
            </div>

            <!-- 새로운 첨부파일 추가 -->
            <div class="mb-3">
                <label for="files" class="form-label">새 첨부파일 추가 (최대 3개)</label>
                <input type="file" class="form-control" id="files" name="files"
                       multiple accept="*/*" onchange="validateFiles(this)">
                <small class="text-muted">* 파일은 최대 3개까지 첨부 가능합니다.(Ctrl + 클릭 시 여러 파일 선택 가능)</small>
                <br>
                <small class="text-muted">* 파일크기는 15MB를 넘을 수 없습니다.</small>
            </div>

            <button type="submit" class="btn btn-primary">수정</button>
            <a th:href="@{/notice/detail/{id}(id=${notice.id})}" class="btn btn-secondary">취소</a>
        </form>
    </div>

    <th:block layout:fragment="script">
    <script src="/js/mermaid/mermaid.min.js"></script>
    <script th:inline="javascript">
        const initialContent = /*[[${notice.content}]]*/ '';
        const editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '500px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            initialValue: initialContent
        });

        document.addEventListener("DOMContentLoaded", function () {
            mermaid.initialize({ startOnLoad: false });

            const inputField = document.getElementById("mermaid-input");
            const preview = document.getElementById("mermaid-preview");

            const renderMermaid = () => {
                const code = inputField.value.trim();
                if (code === "") {
                    preview.innerHTML = "<p style='color:red;'>Mermaid 코드가 없습니다.</p>";
                    return;
                }

                mermaid.render("mermaid-diagram", code)
                    .then(({ svg }) => {
                        preview.innerHTML = svg;
                    })
                    .catch(err => {
                        console.error("Mermaid Rendering Error:", err);
                        preview.innerHTML = "<p style='color:red;'>잘못된 Mermaid 코드입니다.</p>";
                    });
            };

            inputField.addEventListener("input", renderMermaid);
            renderMermaid(); // 초기값 렌더링
        });

        function submitForm() {
            const content = editor.getMarkdown();
            document.getElementById('content').value = content;
            
            // 파일 input의 값이 비어있으면 disabled 처리
            const fileInput = document.getElementById('files');
            if (fileInput.files.length === 0) {
                fileInput.disabled = true;
            }
            
            return true;
        }

        function validateFiles(input) {
            const currentAttachments = /*[[${notice.attachments.size()}]]*/ 0;
            const maxFiles = 3 - currentAttachments;
            
            if (input.files.length > maxFiles) {
                alert('첨부파일은 최대 ' + maxFiles + '개까지만 추가 가능합니다.');
                input.value = '';
                return false;
            }
            
            // 선택된 각 파일의 크기가 0인지 확인
            for (let i = 0; i < input.files.length; i++) {
                if (input.files[i].size === 0) {
                    alert('빈 파일은 업로드할 수 없습니다.');
                    input.value = '';
                    return false;
                }
            }
            return true;
        }
    </script>
    </th:block>
</body>
</html>
