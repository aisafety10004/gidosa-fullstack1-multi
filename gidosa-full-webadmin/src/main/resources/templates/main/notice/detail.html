<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>공지사항 상세</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">공지사항 상세</h2>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${notice.title}"></h5>
                <div class="mb-3">
                    <small class="text-muted">
                        등록일: <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        | 수정일: <span th:text="${#temporals.format(notice.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </small>
                </div>
                <div id="viewer"></div>

                <div class="mt-3" th:if="${!notice.attachments.empty}">
                    <h6>첨부파일</h6>
                    <ul class="list-unstyled">
                        <li th:each="attachment : ${notice.attachments}">
                            <a th:href="@{/common/file/download/{id}(id=${attachment.id})}"
                               th:text="${attachment.originalFilename}"></a>
                            <span class="text-muted">
                                (<span th:text="${#numbers.formatDecimal(attachment.fileSize/1024, 0, 'COMMA', 2, 'POINT')}">
                                </span> KB)
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/notice" class="btn btn-secondary">목록으로</a>
            <a th:href="@{/notice/update/{id}(id=${notice.id})}" class="btn btn-warning">수정</a>
            <form th:action="@{/notice/delete/{id}(id=${notice.id})}" 
                  method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
            </form>
        </div>
    </div>

    <th:block layout:fragment="script">
    <script th:inline="javascript">
        const content = /*[[${notice.content}]]*/ '';
        const viewer = new toastui.Editor.factory({
            el: document.querySelector('#viewer'),
            viewer: true,
            initialValue: content
        });
    </script>
    </th:block>
</body>
</html>
