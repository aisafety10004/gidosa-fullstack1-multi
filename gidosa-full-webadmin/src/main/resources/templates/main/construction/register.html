<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}"
>
<head>
    <!-- <title>건설공사현장 등록</title> -->
</head>
<body>
    <div layout:fragment="content">
        <!-- <h2>건설공사현장 등록</h2> -->
        
        <form th:action="@{/construction/register}" th:object="${construction}" method="post">
            <div class="mb-3 mt-3">
                <label for="name" class="form-label">현장명</label>
                <input type="text" class="form-control" placeholder="현장명을 입력하세요(필수값)" id="name" th:field="*{name}" required>
            </div>
            
            <div class="mb-3">
                <label for="location" class="form-label">현장주소</label>
                <input type="text" class="form-control" placeholder="현장주소를 입력하세요(필수값)" id="location" th:field="*{location}" required>
            </div>
            
            <div class="mb-3">
                <label for="startDate" class="form-label">시작일</label>
                <input type="datetime-local" class="form-control" id="startDate" th:field="*{startDate}">
            </div>
            
            <div class="mb-3">
                <label for="endDate" class="form-label">종료일</label>
                <input type="datetime-local" class="form-control" id="endDate" th:field="*{endDate}">
            </div>
            
            <div class="mb-3">
                <label for="status" class="form-label">상태</label>
                <select class="form-control" id="status" th:field="*{status}">
                    <option value="게시">게시</option>
                    <option value="미게시">미게시</option>
                    <!-- <option value="준비중">준비중</option>
                    <option value="진행중">진행중</option>
                    <option value="완료">완료</option>
                    <option value="중단">중단</option> -->
                </select>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">설명</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">일반 메뉴 선택</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="processManagement" name="managementMenus" value="공정관리" th:field="*{managementMenus}">
                        <label class="form-check-label" for="processManagement">공정관리</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="qualityManagement" name="managementMenus" value="품질관리" th:field="*{managementMenus}">
                        <label class="form-check-label" for="qualityManagement">품질관리</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="safetyManagement" name="managementMenus" value="안전관리" th:field="*{managementMenus}">
                        <label class="form-check-label" for="safetyManagement">안전관리</label>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">확장 메뉴 선택</label>
                <div class="d-flex flex-wrap gap-4">
                    <div class="form-check" th:each="customMenu : ${templateCustomMenus}">
                        <input class="form-check-input" type="checkbox" th:id="${'customMenu-' + customMenu.id}" 
                               name="selectedCustomMenuIds" th:value="${customMenu.id}"
                               th:checked="${construction.selectedCustomMenuIds != null && construction.selectedCustomMenuIds.contains(customMenu.id)}">
                        <label class="form-check-label" th:for="${'customMenu-' + customMenu.id}" th:text="${customMenu.name}"></label>
                    </div>
                    <div th:if="${#lists.isEmpty(templateCustomMenus)}" class="text-muted">
                        사용 가능한 템플릿 메뉴가 없습니다.
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">등록</button>
            <a href="/construction/list" class="btn btn-secondary">취소</a>
        </form>
    </div>
</body>
</html>
