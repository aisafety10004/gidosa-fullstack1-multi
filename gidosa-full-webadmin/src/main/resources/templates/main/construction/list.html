<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}"
>
<head>
    <title>건설공사현장 목록</title>
    <style>
        .sort-icon {
            display: inline-block;
            margin-left: 5px;
            color: inherit;
        }
        .table-dark .sort-icon {
            color: inherit;
        }
        .sortable {
            cursor: pointer;
        }
        .sortable:hover {
            background-color: #f8f9fa;
        }
        .sortable::after {
            content: "↕";
            margin-left: 5px;
            opacity: 0.5;
        }
        .sortable.asc::after {
            content: "↑";
            opacity: 1;
        }
        .sortable.desc::after {
            content: "↓";
            opacity: 1;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <h2>건설공사현장 목록</h2>
        
        <!-- 검색 폼 추가 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">검색 항목</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/construction/list}" method="get" class="row g-3" id="searchForm">
                    <div class="col-md-3">
                        <label for="name" class="form-label">현장명</label>
                        <input type="text" class="form-control" id="name" name="name" th:value="${name}" 
                               placeholder="현장명을 입력하세요">
                    </div>
                    <div class="col-md-3">
                        <label for="location" class="form-label">위치</label>
                        <input type="text" class="form-control" id="location" name="location" th:value="${location}" 
                               placeholder="위치를 입력하세요">
                    </div>
                    <div class="col-md-3">
                        <label for="status" class="form-label">상태</label>
                        <input type="text" class="form-control" id="status" name="status" th:value="${status}" 
                               placeholder="상태를 입력하세요">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="fas fa-search"></i> 검색
                        </button>
                        <a th:href="@{/construction/list}" class="btn btn-secondary">
                            <i class="fas fa-redo"></i> 초기화
                        </a>
                    </div>
                    <div class="col-12">
                        <small class="text-muted">* 대소문자를 구분하지 않고 검색합니다. 부분 검색이 가능합니다.</small>
                    </div>
                    
                    <!-- 정렬 및 페이지 크기 선택을 위한 숨겨진 필드 -->
                    <input type="hidden" name="sort" id="sort" th:value="${sort}">
                    <input type="hidden" name="direction" id="direction" th:value="${direction}">
                </form>
            </div>
        </div>
        
        <div class="d-flex justify-content-between mb-3">
            <div>
                <span class="text-muted">총 <strong th:text="${constructions.totalElements}">0</strong>개의 건설공사현장이 있습니다.</span>
            </div>
        </div>

        <div class="d-flex mb-3 justify-content-between">
            <a href="/construction/register" class="btn btn-primary">신규 등록</a>
            <div class="">
                <div class="me-3">
                    <label for="size" class="me-2">페이지 크기:</label>
                    <select id="size" name="size" class="form-select form-select-sm" style="width: auto; display: inline-block;">
                        <option value="10" th:selected="${size == 10}">10</option>
                        <option value="20" th:selected="${size == 20}">20</option>
                        <option value="30" th:selected="${size == 30}">30</option>
                    </select>
                </div>
            </div>
        </div>
        
        <table class="table table-striped table-hover">
            <!-- <thead class="table-dark">
                <tr style="text-align: center;">
                    <th class="sortable" data-field="id">
                        ID
                        <span class="sort-icon" th:if="${sort == 'id' && direction == 'asc'}">
                            <i class="fas fa-sort-up"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort == 'id' && direction == 'desc'}">
                            <i class="fas fa-sort-down"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort != 'id'}">
                            <i class="fas fa-sort"></i>
                        </span>
                    </th>

                            <i class="fas fa-sort-up"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort == 'name' && direction == 'desc'}">
                            <i class="fas fa-sort-down"></i>

                            <i class="fas fa-sort"></i>
                        </span>

                        위치 주소
                        <span class="sort-icon" th:if="${sort == 'location' && direction == 'asc'}">
                            <i class="fas fa-sort-up"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort == 'location' && direction == 'desc'}">
                            <i class="fas fa-sort-down"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort != 'location'}">
                            <i class="fas fa-sort"></i>
                        </span>
                    </th>
                    <th class="sortable" data-field="startDate">
                        시작일
                        <span class="sort-icon" th:if="${sort == 'startDate' && direction == 'asc'}">
                            <i class="fas fa-sort-up"></i>

                        종료일
                        <span class="sort-icon" th:if="${sort == 'endDate' && direction == 'asc'}">
                            <i class="fas fa-sort-up"></i>

                        </span>
                        <span class="sort-icon" th:if="${sort != 'endDate'}">
                            <i class="fas fa-sort"></i>
                        </span>
                    </th>
                    <th class="sortable" data-field="status">
                        상태
                        <span class="sort-icon" th:if="${sort == 'status' && direction == 'asc'}">
                            <i class="fas fa-sort-up"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort == 'status' && direction == 'desc'}">
                            <i class="fas fa-sort-down"></i>
                        </span>
                        <span class="sort-icon" th:if="${sort != 'status'}">
                            <i class="fas fa-sort"></i>
                        </span>
                    </th>
                    <th>관리</th>
                </tr>
            </thead> -->
            <thead>
                <tr style="text-align: center;">
                    <th class="sortable" 
                        th:classappend="${param.sort != null && param.sort[0] == 'id' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="id">ID</th>
                    <th class="sortable" 
                        th:classappend="${param.sort != null && param.sort[0] == 'name' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="name">현장명</th>
                    <th class="sortable" 
                        th:classappend="${param.location != null && param.sort[0] == 'location' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="location">위치주소</th>
                    <th class="sortable" 
                        th:classappend="${param.startDate != null && param.sort[0] == 'startDate' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="startDate">시작일</th>
                    <th class="sortable" 
                        th:classappend="${param.endDate != null && param.sort[0] == 'endDate' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="endDate">종료일</th>
                    <th class="sortable" 
                        th:classappend="${param.status != null && param.sort[0] == 'status' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="status">상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="construction : ${constructions}">
                    <td th:text="${construction.id}"></td>
                    <td>
                        <a th:href="@{/construction/detail/{id}(id=${construction.id})}" 
                           th:text="${construction.name}"></a>
                    </td>
                    <td th:text="${construction.location}"></td>
                    <td th:text="${#temporals.format(construction.startDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${#temporals.format(construction.endDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${construction.status}"></td>
                    <td>
                        <a th:href="@{/construction/edit/{id}(id=${construction.id})}"
                           class="btn btn-sm btn-warning">수정</a>
                        <a th:href="@{/construction/delete/{id}(id=${construction.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                    </td>
                </tr>
                <tr th:if="${constructions.empty}">
                    <td colspan="7" class="text-center">검색 결과가 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 추가 -->
        <nav aria-label="Page navigation" th:if="${constructions.totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!constructions.hasPrevious()} ? disabled">
                    <a class="page-link" th:href="@{/construction/list(page=${constructions.number - 1}, name=${name}, location=${location}, status=${status}, sort=${sort}, direction=${direction}, size=${size})}"
                       th:unless="${!constructions.hasPrevious()}">이전</a>
                    <span class="page-link" th:if="${!constructions.hasPrevious()}">이전</span>
                </li>

                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, constructions.totalPages - 1)}"
                    th:classappend="${pageNumber == constructions.number} ? active">
                    <a class="page-link" th:href="@{/construction/list(page=${pageNumber}, name=${name}, location=${location}, status=${status}, sort=${sort}, direction=${direction}, size=${size})}"
                       th:text="${pageNumber + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${!constructions.hasNext()} ? disabled">
                    <a class="page-link" th:href="@{/construction/list(page=${constructions.number + 1}, name=${name}, location=${location}, status=${status}, sort=${sort}, direction=${direction}, size=${size})}"
                       th:unless="${!constructions.hasNext()}">다음</a>
                    <span class="page-link" th:if="${!constructions.hasNext()}">다음</span>
                </li>
            </ul>
        </nav>
        
        <!-- JavaScript for sorting and page size selection -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // 정렬 기능
                const sortableHeaders = document.querySelectorAll('.sortable');
                sortableHeaders.forEach(header => {
                    header.addEventListener('click', function() {
                        // const field = this.getAttribute('data-field');
                        const field = this.getAttribute('data-sort');
                        const currentSort = document.getElementById('sort').value;
                        const currentDirection = document.getElementById('direction').value;
                        
                        let newDirection = 'asc';
                        if (field === currentSort && currentDirection === 'asc') {
                            newDirection = 'desc';
                        }
                        
                        document.getElementById('sort').value = field;
                        document.getElementById('direction').value = newDirection;
                        document.getElementById('searchForm').submit();
                    });
                });
                
                // 페이지 크기 선택
                document.getElementById('size').addEventListener('change', function() {
                    const size = this.value;
                    const currentUrl = new URL(window.location.href);
                    currentUrl.searchParams.set('size', size);
                    window.location.href = currentUrl.toString();
                });
            });
        </script>
    </div>
</body>
</html>
