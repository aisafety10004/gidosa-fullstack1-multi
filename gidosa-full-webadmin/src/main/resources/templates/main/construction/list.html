<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}"
>
<head>
    <title>건설공사현장 목록</title>
</head>
<body>
    <div layout:fragment="content">
        <h2>건설공사현장 목록</h2>
        <a href="/construction/register" class="btn btn-primary mb-3">신규 등록</a>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>현장명</th>
                    <th>위치</th>
                    <th>시작일</th>
                    <th>종료일</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="construction : ${constructions}">
                    <td th:text="${construction.id}"></td>
                    <td>
                        <a th:href="@{/construction/detail/{id}(id=${construction.id})}" 
                           th:text="${construction.name}"></a>
                    </td>
                    <td th:text="${construction.location}"></td>
                    <td th:text="${#temporals.format(construction.startDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${#temporals.format(construction.endDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${construction.status}"></td>
                    <td>
                        <a th:href="@{/construction/update/{id}(id=${construction.id})}"
                           class="btn btn-sm btn-warning">수정</a>
                        <a th:href="@{/construction/delete/{id}(id=${construction.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 추가 -->
        <nav aria-label="Page navigation" th:if="${constructions.totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!constructions.hasPrevious()} ? disabled">
                    <a class="page-link" th:href="@{/construction/list(page=${constructions.number - 1})}"
                       th:unless="${!constructions.hasPrevious()}">이전</a>
                    <span class="page-link" th:if="${!constructions.hasPrevious()}">이전</span>
                </li>

                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, constructions.totalPages - 1)}"
                    th:classappend="${pageNumber == constructions.number} ? active">
                    <a class="page-link" th:href="@{/construction/list(page=${pageNumber})}"
                       th:text="${pageNumber + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${!constructions.hasNext()} ? disabled">
                    <a class="page-link" th:href="@{/construction/list(page=${constructions.number + 1})}"
                       th:unless="${!constructions.hasNext()}">다음</a>
                    <span class="page-link" th:if="${!constructions.hasNext()}">다음</span>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
