<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}"
>
<head>
    <title>건설공사현장 상세정보</title>
</head>
<body>
    <div layout:fragment="content">
        <h2>건설공사현장 상세정보</h2>
        <div class="card">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">현장명</div>
                    <div class="col-md-10" th:text="${construction.name}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">위치</div>
                    <div class="col-md-10" th:text="${construction.location}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">시작일</div>
                    <div class="col-md-10" th:text="${#temporals.format(construction.startDate, 'yyyy-MM-dd')}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">종료일</div>
                    <div class="col-md-10" th:text="${#temporals.format(construction.endDate, 'yyyy-MM-dd')}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">상태</div>
                    <div class="col-md-10" th:text="${construction.status}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">설명</div>
                    <div class="col-md-10" th:text="${construction.description}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">관리 메뉴</div>
                    <div class="col-md-10">
                        <ul class="list-unstyled">
                            <li th:each="menu : ${construction.managementMenus}" th:text="${menu}"></li>
                        </ul>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-2 font-weight-bold">등록일</div>
                    <div class="col-md-10" th:text="${#temporals.format(construction.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <a th:href="@{/construction/list}" class="btn btn-secondary">목록으로</a>
            <a th:href="@{/construction/update/{id}(id=${construction.id})}" class="btn btn-warning">수정</a>
            <a th:href="@{/construction/delete/{id}(id=${construction.id})}"
               class="btn btn-danger"
               onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
        </div>
    </div>
</body>
</html>
