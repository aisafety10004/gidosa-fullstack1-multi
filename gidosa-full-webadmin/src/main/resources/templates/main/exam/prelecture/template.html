<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
  layout:decorate="~{layouts/admin}">

<head>
  <title>학습 자료 관리</title>
</head>

<body>
  <div layout:fragment="content">
    <div class="container-fluid">
      <h1 class="h3 mb-4 text-gray-800">학습 자료 관리</h1>

      <!-- 알림 메시지 -->
      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <!-- 학습 자료 목록 -->
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">학습 자료 목록</h6>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered" width="100%" cellspacing="0">
              <thead>
                <tr>
                  <th>제목</th>
                  <th>설명</th>
                  <th>유형</th>
                  <th>학습 시간</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="material : ${materials}">
                  <td>
                    <div class="font-weight-bold" th:text="${material.title}"></div>
                    <div th:if="${material.type == 'PPT'}">
                      <a th:href="@{'/exam/prelecture/template/download/' + ${material.id}}" class="small text-primary">
                        <i class="fas fa-file-powerpoint"></i> PPT 다운로드
                      </a>
                    </div>
                    <div th:if="${material.type == 'URL'}">
                      <a th:href="${material.url}" target="_blank" class="small text-primary">
                        <i class="fas fa-external-link-alt"></i> 링크 보기
                      </a>
                    </div>
                  </td>
                  <td th:text="${material.description}"></td>
                  <td>
                    <span th:if="${material.type == 'PPT'}" class="badge badge-info"
                      style="background-color: #17a2b8; color: white;">PPT</span>
                    <span th:if="${material.type == 'URL'}" class="badge badge-danger"
                      style="background-color: #dc3545; color: white;">링크</span>
                  </td>
                  <td th:text="${material.duration + '분'}"></td>
                  <td>
                    <button class="btn btn-sm btn-primary" th:onclick="'editMaterial(' + ${material.id} + ')'">
                      <i class="fas fa-edit"></i> 수정
                    </button>
                    <form th:action="@{/exam/prelecture/template/delete}" method="post" style="display: inline;">
                      <input type="hidden" name="materialId" th:value="${material.id}">
                      <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('정말 삭제하시겠습니까?');">
                        <i class="fas fa-trash"></i> 삭제
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- 페이지네이션 -->
          <div class="d-flex justify-content-center mt-4">
            <nav th:if="${totalPages > 1}">
              <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                  <a class="page-link" th:href="@{/exam/prelecture/template(page=${currentPage - 1})}">이전</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                  th:classappend="${currentPage == i} ? 'active'">
                  <a class="page-link" th:href="@{/exam/prelecture/template(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                  <a class="page-link" th:href="@{/exam/prelecture/template(page=${currentPage + 1})}">다음</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>

      <!-- 학습 자료 등록 폼 -->
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">학습 자료 등록</h6>
        </div>
        <div class="card-body">
          <form th:action="@{/exam/prelecture/template/create}" th:object="${learningMaterial}" method="post"
            enctype="multipart/form-data" class="needs-validation" novalidate>
            <div class="row">
              <div class="col-md-12 d-flex flex-column gap-3">
                <div class="form-group">
                  <label for="title">제목 <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="title" th:field="*{title}" required>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="form-group">
                  <label for="description">설명</label>
                  <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                  </div>
                </div>
                <div class="form-group">
                  <label for="type">자료 유형 <span class="text-danger">*</span></label>
                  <select class="form-control" id="type" th:field="*{type}" required onchange="toggleUploadField()">
                    <option value="">선택하세요</option>
                    <option value="PPT">PPT</option>
                    <option value="URL">링크</option>
                  </select>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>
                <div class="form-group">
                  <label for="duration">학습 시간(분) <span class="text-danger">*</span></label>
                  <input type="number" class="form-control" id="duration" th:field="*{duration}" required min="1">
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                </div>
                <div id="pptUploadGroup" class="form-group" style="display: none;">
                  <label for="file">PPT 파일 <span class="text-danger">*</span></label>
                  <input type="file" class="form-control-file" id="file" th:field="*{file}" accept=".ppt,.pptx"
                    required>
                  <small class="form-text text-muted">PPT 또는 PPTX 파일만 업로드 가능합니다.</small>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('file')}" th:errors="*{file}"></div>
                </div>
                <div id="urlGroup" class="form-group" style="display: none;">
                  <label for="url">링크 주소 <span class="text-danger">*</span></label>
                  <input type="url" class="form-control" id="url" th:field="*{url}" placeholder="https://..." required>
                  <small class="form-text text-muted">YouTube, 블로그, 웹사이트 등 다양한 링크를 입력할 수 있습니다.</small>
                  <div class="invalid-feedback" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>
                </div>
              </div>
            </div>
            <div class="text-right">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> 저장
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <th:block layout:fragment="script">
    <script>
      function toggleUploadField() {
        const type = $('#type').val();
        if (type === 'PPT') {
          $('#pptUploadGroup').show();
          $('#urlGroup').hide();
          $('#file').prop('required', true);
          $('#url').prop('required', false);
        } else if (type === 'URL') {
          $('#pptUploadGroup').hide();
          $('#urlGroup').show();
          $('#file').prop('required', false);
          $('#url').prop('required', true);
        } else {
          $('#pptUploadGroup').hide();
          $('#urlGroup').hide();
          $('#file').prop('required', false);
          $('#url').prop('required', false);
        }
      }

      $(document).ready(function () {
        toggleUploadField();

        // Bootstrap 유효성 검사
        (function () {
          'use strict';
          window.addEventListener('load', function () {
            var forms = document.getElementsByClassName('needs-validation');
            var validation = Array.prototype.filter.call(forms, function (form) {
              form.addEventListener('submit', function (event) {
                if (form.checkValidity() === false) {
                  event.preventDefault();
                  event.stopPropagation();
                }
                form.classList.add('was-validated');
              }, false);
            });
          }, false);
        })();
      });

      // 학습 자료 수정
      function editMaterial(materialId) {
        window.location.href = '/exam/prelecture/template/edit/' + materialId;
      }
    </script>
  </th:block>
</body>

</html>
