<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <!-- <title>일반 회원 목록</title> -->
</head>
<body>
    <div layout:fragment="content">
        <!-- <h2 class="mb-4">일반 회원 목록</h2> -->

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- 검색 폼 추가 -->
        <div class="card mb-4 mt-3">
            <div class="card-header">
                <i class="fas fa-search"></i> 회원 검색
            </div>
            <div class="card-body">
                <form th:action="@{/member/general/list}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label for="searchType" class="form-label">검색 항목</label>
                        <select class="form-select" id="searchType" name="searchType">
                            <option value="">-- 선택 --</option>
                            <option value="username" th:selected="${searchType != null && searchType == 'username'}">아이디(사용자명)</option>
                            <option value="name" th:selected="${searchType != null && searchType == 'name'}">이름</option>
                            <option value="email" th:selected="${searchType != null && searchType == 'email'}">이메일</option>
                            <option value="phone" th:selected="${searchType != null && searchType == 'phone'}">휴대폰번호</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="searchKeyword" class="form-label">검색어</label>
                        <input type="text" class="form-control" id="searchKeyword" name="searchKeyword" 
                               th:value="${searchKeyword != null ? searchKeyword : ''}" placeholder="검색어를 입력하세요">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">가입일 검색</label>
                        <div class="input-group">
                            <input type="date" class="form-control" id="startDate" name="startDate" 
                                   th:value="${startDate != null ? startDate : ''}" placeholder="시작일">
                            <span class="input-group-text">~</span>
                            <input type="date" class="form-control" id="endDate" name="endDate" 
                                   th:value="${endDate != null ? endDate : ''}" placeholder="종료일">
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary">검색</button>
                        <a th:href="@{/member/general/list}" class="btn btn-secondary">초기화</a>
                    </div>
                    
                    <!-- 페이징 정보 유지를 위한 hidden 필드 -->
                    <input type="hidden" name="page" value="0">
                </form>
            </div>
        </div>

        <table class="table">
            <thead>
                <tr style="text-align: center;">
                    <th>ID</th>
                    <th>아이디(사용자명)</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화번호</th>
                    <th>가입일</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members.content}">
                    <td th:text="${member.id}"></td>
                    <td th:text="${member.username}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.phone}"></td>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/member/general/detail/{id}(id=${member.id})}" 
                           class="btn btn-sm btn-info">상세</a>
                        <a th:href="@{/member/general/update/{id}(id=${member.id})}" 
                           class="btn btn-sm btn-warning">수정</a>
                        <form th:action="@{/member/general/delete/{id}(id=${member.id})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </td>
                </tr>
                <!-- 검색 결과가 없는 경우 메시지 표시 -->
                <tr th:if="${members.content.empty}">
                    <td colspan="7" class="text-center">검색 결과가 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 네비게이션 수정 - 검색 조건 유지 -->
        <nav aria-label="Page navigation" th:if="${members.totalPages > 0}">
            <ul class="pagination justify-content-center">
                <!-- 이전 페이지 -->
                <li class="page-item" th:classappend="${!members.hasPrevious()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/member/general/list(page=${members.number - 1}, 
                                                     searchType=${searchType != null ? searchType : ''}, 
                                                     searchKeyword=${searchKeyword != null ? searchKeyword : ''}, 
                                                     startDate=${startDate != null ? startDate : ''}, 
                                                     endDate=${endDate != null ? endDate : ''})}"
                       th:unless="${!members.hasPrevious()}">이전</a>
                    <span class="page-link" th:if="${!members.hasPrevious()}">이전</span>
                </li>

                <!-- 페이지 번호 -->
                <li class="page-item" 
                    th:each="pageNumber : ${#numbers.sequence(0, members.totalPages - 1)}"
                    th:classappend="${pageNumber == members.number} ? active">
                    <a class="page-link" 
                       th:href="@{/member/general/list(page=${pageNumber}, 
                                                     searchType=${searchType != null ? searchType : ''}, 
                                                     searchKeyword=${searchKeyword != null ? searchKeyword : ''}, 
                                                     startDate=${startDate != null ? startDate : ''}, 
                                                     endDate=${endDate != null ? endDate : ''})}"
                       th:text="${pageNumber + 1}"></a>
                </li>

                <!-- 다음 페이지 -->
                <li class="page-item" th:classappend="${!members.hasNext()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/member/general/list(page=${members.number + 1}, 
                                                     searchType=${searchType != null ? searchType : ''}, 
                                                     searchKeyword=${searchKeyword != null ? searchKeyword : ''}, 
                                                     startDate=${startDate != null ? startDate : ''}, 
                                                     endDate=${endDate != null ? endDate : ''})}"
                       th:unless="${!members.hasNext()}">다음</a>
                    <span class="page-link" th:if="${!members.hasNext()}">다음</span>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
