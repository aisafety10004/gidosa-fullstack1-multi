<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/basic.html}">
<head>
    <title>일반 회원 목록</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">일반 회원 목록</h2>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>사용자명</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화번호</th>
                    <th>가입일</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members.content}">
                    <td th:text="${member.id}"></td>
                    <td th:text="${member.username}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.phone}"></td>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/member/general/detail/{id}(id=${member.id})}" 
                           class="btn btn-sm btn-info">상세</a>
                        <a th:href="@{/member/general/update/{id}(id=${member.id})}" 
                           class="btn btn-sm btn-warning">수정</a>
                        <form th:action="@{/member/general/delete/{id}(id=${member.id})}" 
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 네비게이션 추가 -->
        <nav aria-label="Page navigation" th:if="${members.totalPages > 0}">
            <ul class="pagination justify-content-center">
                <!-- 이전 페이지 -->
                <li class="page-item" th:classappend="${!members.hasPrevious()} ? disabled">
                    <a class="page-link" th:href="@{/member/general/list(page=${members.number - 1})}"
                       th:unless="${!members.hasPrevious()}">이전</a>
                    <span class="page-link" th:if="${!members.hasPrevious()}">이전</span>
                </li>

                <!-- 페이지 번호 -->
                <li class="page-item" 
                    th:each="pageNumber : ${#numbers.sequence(0, members.totalPages - 1)}"
                    th:classappend="${pageNumber == members.number} ? active">
                    <a class="page-link" 
                       th:href="@{/member/general/list(page=${pageNumber})}"
                       th:text="${pageNumber + 1}"></a>
                </li>

                <!-- 다음 페이지 -->
                <li class="page-item" th:classappend="${!members.hasNext()} ? disabled">
                    <a class="page-link" th:href="@{/member/general/list(page=${members.number + 1})}"
                       th:unless="${!members.hasNext()}">다음</a>
                    <span class="page-link" th:if="${!members.hasNext()}">다음</span>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
