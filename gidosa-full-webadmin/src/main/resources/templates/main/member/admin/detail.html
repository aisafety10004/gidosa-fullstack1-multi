<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>매니저 상세 정보</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">매니저 상세 정보</h2>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3"><strong>ID:</strong></div>
                    <div class="col-md-9" th:text="${member.id}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>사용자명:</strong></div>
                    <div class="col-md-9" th:text="${member.username}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>이름:</strong></div>
                    <div class="col-md-9" th:text="${member.name}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>이메일:</strong></div>
                    <div class="col-md-9" th:text="${member.email}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>전화번호:</strong></div>
                    <div class="col-md-9" th:text="${member.phone}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>지역:</strong></div>
                    <div class="col-md-9" th:text="${member.location}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>건설공사현장:</strong></div>
                    <div class="col-md-9" th:text="${member.construction != null ? member.construction.location : '-'}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>권한:</strong></div>
                    <div class="col-md-9" th:text="${member.role}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>상태:</strong></div>
                    <div class="col-md-9">
                        <span th:class="${member.active ? 'badge bg-success' : 'badge bg-danger'}"
                              th:text="${member.active ? '활성' : '비활성'}"></span>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>가입일:</strong></div>
                    <div class="col-md-9" th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3"><strong>수정일:</strong></div>
                    <div class="col-md-9" th:text="${#temporals.format(member.updatedAt, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/member/admin/list}" class="btn btn-secondary">목록으로</a>
            <a th:href="@{/member/admin/update/{id}(id=${member.id})}" class="btn btn-warning">수정</a>
            <form th:action="@{/member/admin/delete/{id}(id=${member.id})}" 
                  method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
            </form>
            <!-- 계정 활성/비활성 토글 버튼 -->
            <form th:action="@{/member/admin/toggle-status/{id}(id=${member.id})}" 
                  method="post" style="display: inline;">
                <button type="submit" th:class="${member.active ? 'btn btn-danger' : 'btn btn-success'}"
                        onclick="return confirm('계정 상태를 변경하시겠습니까?');"
                        th:text="${member.active ? '계정 비활성화' : '계정 활성화'}">
                </button>
            </form>
        </div>
    </div>
</body>
</html>
