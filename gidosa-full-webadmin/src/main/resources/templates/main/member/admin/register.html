<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>매니저 등록</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">매니저 등록</h2>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/member/admin/register}" th:object="${memberAdminDto}"
              method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">아이디 *</label>
                <input type="text" class="form-control" id="username" 
                       th:field="*{username}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" 
                     th:errors="*{username}" style="display: block;">아이디 오류</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호 *</label>
                <input type="password" class="form-control" id="password" 
                       th:field="*{password}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}" style="display: block;">비밀번호 오류</div>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">이름 *</label>
                <input type="text" class="form-control" id="name" 
                       th:field="*{name}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}" style="display: block;">이름 오류</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">이메일 *</label>
                <input type="email" class="form-control" id="email" 
                       th:field="*{email}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}" style="display: block;">이메일 오류</div>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">전화번호 *</label>
                <input type="tel" class="form-control" id="phone" 
                       th:field="*{phone}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                     th:errors="*{phone}" style="display: block;">전화번호 오류</div>
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">현장명</label>
                <input type="text" class="form-control" id="location" 
                       th:field="*{location}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}"
                     th:errors="*{location}" style="display: block;">현장명 오류</div>
            </div>

            <!-- 건설공사현장 선택 필드 추가 -->
            <div class="mb-3">
                <label for="construction" class="form-label">현장주소</label>
                <select class="form-select" id="construction" th:field="*{constructionId}">
                    <option value="">선택하세요</option>
                    <option th:each="construction : ${constructions}"
                            th:value="${construction.id}"
                            th:text="${construction.location}"
                            th:selected="${constructionId == construction.id}"
                    >
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">권한 *</label>
                <select class="form-select" id="role" th:field="*{role}" required>
                    <option value="ROLE_MANAGER" th:selected="*{role == 'ROLE_MANAGER'}">일반 관리자</option>
                    <option value="ROLE_ADMIN" th:selected="*{role == 'ROLE_ADMIN'}">최고 관리자</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">등록</button>
            <a th:href="@{/member/admin/list}" class="btn btn-secondary">취소</a>
        </form>
    </div>

    <!-- 폼 유효성 검사를 위한 JavaScript -->
    <script layout:fragment="script">
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
</body>
</html>
