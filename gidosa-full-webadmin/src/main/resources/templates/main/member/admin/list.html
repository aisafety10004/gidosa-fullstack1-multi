<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>매니저 목록</title>
    <style>
        .sortable {
            cursor: pointer;
        }
        .sortable:hover {
            background-color: #f8f9fa;
        }
        .sortable::after {
            content: "↕";
            margin-left: 5px;
            opacity: 0.5;
        }
        .sortable.asc::after {
            content: "↑";
            opacity: 1;
        }
        .sortable.desc::after {
            content: "↓";
            opacity: 1;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <!-- <h2 class="mb-4">매니저 목록</h2> -->

        <!-- 검색 폼 추가 -->
        <div class="card mb-4 mt-4">
            <div class="card-body">
                <form th:action="@{/member/admin/list}" method="get" class="row g-3 align-items-end" id="searchForm" onsubmit="return validateSearchForm()">
                    <div class="col-md-3">
                        <label for="searchType" class="form-label">검색 항목</label>
                        <select id="searchType" name="searchType" class="form-select">
                            <option value="username" th:selected="${searchType == 'username'}">아이디</option>
                            <option value="name" th:selected="${searchType == 'name'}">이름</option>
                            <option value="email" th:selected="${searchType == 'email'}">이메일</option>
                            <option value="phone" th:selected="${searchType == 'phone'}">전화번호</option>
                        </select>
                    </div>
                    <div class="col-md-7">
                        <label for="keyword" class="form-label">검색어</label>
                        <input type="text" id="keyword" name="keyword" class="form-control" 
                               th:value="${keyword}" placeholder="검색어를 입력하세요">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">검색</button>
                        <a th:href="@{/member/admin/list}" class="btn btn-outline-secondary w-100">검색 초기화</a>
                    </div>
                    
                    <!-- 정렬을 위한 hidden 필드 추가 -->
                    <input type="hidden" id="sort" name="sort" th:value="${param.sort}">
                    <input type="hidden" id="direction" name="direction" th:value="${param.direction}">
                    
                    <!-- 페이지 크기를 위한 hidden 필드 추가 -->
                    <input type="hidden" id="size" name="size" th:value="${param.size}">
                </form>
            </div>
        </div>

        <!-- 검색결과 및 페이지 크기 선택 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <!-- <div th:if="${keyword != null && keyword != ''}"> -->
            <div>
                <span class="ms-2">검색 결과: 총 <strong th:text="${memberAdminListPage.totalElements}"></strong>건</span>
            </div>
            <div class="d-flex align-items-center ms-auto">
                <label for="pageSizeSelect" class="form-label me-2 mb-0">페이지 크기:</label>
                <select id="pageSizeSelect" class="form-select form-select-sm" style="width: auto;">
                    <option value="10" th:selected="${memberAdminListPage.size == 10}">10</option>
                    <option value="20" th:selected="${memberAdminListPage.size == 20}">20</option>
                    <option value="30" th:selected="${memberAdminListPage.size == 30}">30</option>
                </select>
            </div>
        </div>

        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- 등록 버튼 추가 -->
        <div class="mb-3 mt-3">
            <!-- <a th:href="@{/member/admin/register}" class="btn btn-primary">새 매니저 등록</a> -->
            <a th:href="@{/member/admin/register}" class="btn btn-primary">현장관리자 등록</a>
        </div>

        <table class="table">
            <thead>
                <tr style="text-align: center;">
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'id' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="id">ID</th>
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'username' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="username">아이디</th>
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'name' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="name">이름</th>
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'email' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="email">이메일</th>
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'phone' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="phone">전화번호</th>
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'location' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="location">현장명</th>
                    <th class="sortable" th:classappend="${param.sort != null && param.sort[0] == 'createdAt' ? (param.direction != null && param.direction[0] == 'desc' ? 'desc' : 'asc') : ''}" 
                        data-sort="createdAt">가입일</th>
                    <th>현장주소</th>                        
<!--                    <th>계정활성여부</th>-->
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="memberAdmin : ${memberAdminListPage.content}">
                    <td th:text="${memberAdmin.id}"></td>
                    <td th:text="${memberAdmin.username}"></td>
                    <td th:text="${memberAdmin.name}"></td>
                    <td th:text="${memberAdmin.email}"></td>
                    <td th:text="${memberAdmin.phone}"></td>
                    <td th:utext="${memberAdmin.location}"></td>
                    <td th:text="${#temporals.format(memberAdmin.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${memberAdmin.construction != null ? memberAdmin.construction.location : '-'}"></td>
<!--                    <td>-->
<!--                        <span th:class="${memberAdmin.active ? 'badge bg-success' : 'badge bg-danger'}"-->
<!--                              th:text="${memberAdmin.active ? '활성' : '비활성'}"></span>-->
<!--                    </td>-->
                    <td>
                        <a th:href="@{/member/admin/detail/{id}(id=${memberAdmin.id})}"
                           class="btn btn-sm btn-info">상세</a>
                        <a th:href="@{/member/admin/update/{id}(id=${memberAdmin.id})}"
                           class="btn btn-sm btn-warning">수정</a>
                        <form th:action="@{/member/admin/delete/{id}(id=${memberAdmin.id})}"
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 네비게이션 -->
        <nav aria-label="Page navigation" th:if="${memberAdminListPage.totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!memberAdminListPage.hasPrevious()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/member/admin/list(page=${memberAdminListPage.number - 1}, searchType=${searchType}, keyword=${keyword}, sort=${param.sort}, direction=${param.direction}, size=${param.size})}"
                       th:unless="${!memberAdminListPage.hasPrevious()}">이전</a>
                    <span class="page-link" th:if="${!memberAdminListPage.hasPrevious()}">이전</span>
                </li>

                <li class="page-item" 
                    th:each="pageNumber : ${#numbers.sequence(0, memberAdminListPage.totalPages - 1)}"
                    th:classappend="${pageNumber == memberAdminListPage.number} ? active">
                    <a class="page-link" 
                       th:href="@{/member/admin/list(page=${pageNumber}, searchType=${searchType}, keyword=${keyword}, sort=${param.sort}, direction=${param.direction}, size=${param.size})}"
                       th:text="${pageNumber + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${!memberAdminListPage.hasNext()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/member/admin/list(page=${memberAdminListPage.number + 1}, searchType=${searchType}, keyword=${keyword}, sort=${param.sort}, direction=${param.direction}, size=${param.size})}"
                       th:unless="${!memberAdminListPage.hasNext()}">다음</a>
                    <span class="page-link" th:if="${!memberAdminListPage.hasNext()}">다음</span>
                </li>
            </ul>
        </nav>
    </div>
    
    <!-- JavaScript for form validation and sorting -->
    <script layout:fragment="script" th:inline="javascript">
        function validateSearchForm() {
            const keyword = document.getElementById('keyword').value.trim();
            if (keyword === '') {
                alert('검색어를 입력하세요');
                document.getElementById('keyword').focus();
                return false;
            }
            return true;
        }
        
        // 정렬 기능 구현
        document.addEventListener('DOMContentLoaded', function() {
            // 정렬 가능한 헤더에 클릭 이벤트 추가
            const sortableHeaders = document.querySelectorAll('.sortable');
            sortableHeaders.forEach(header => {
                header.addEventListener('click', function() {
                    const sort = this.getAttribute('data-sort');
                    const currentSort = document.getElementById('sort').value;
                    const currentDirection = document.getElementById('direction').value;
                    
                    let newDirection = 'asc';
                    if (sort === currentSort && currentDirection === 'asc') {
                        newDirection = 'desc';
                    }
                    
                    // 정렬 파라미터 설정
                    document.getElementById('sort').value = sort;
                    document.getElementById('direction').value = newDirection;
                    
                    // 폼 제출
                    document.getElementById('searchForm').submit();
                });
            });
            
            // 페이지 크기 변경 이벤트 추가
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            pageSizeSelect.addEventListener('change', function() {
                document.getElementById('size').value = this.value;
                document.getElementById('searchForm').submit();
            });
        });
    </script>
</body>
</html>
