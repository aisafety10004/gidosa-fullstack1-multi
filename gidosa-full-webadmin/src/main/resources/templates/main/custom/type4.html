<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title th:text="${menu.name}"></title>
    <style>
      .content-container {
          min-height: 300px;
      }
      .form-group.row {
          margin-bottom: 16px;
      }
  </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="card mt-4">
            <div class="card-header">
                <h3 th:text="${menu.name}"></h3>
                <p th:if="${menu.description}" th:text="${menu.description}" class="text-muted"></p>
            </div>
            <div class="card-body">
                <form th:action="@{'/custom/save/type4/' + ${menu.id}}" method="post" enctype="multipart/form-data" onsubmit="return submitForm()">
                    <div class="mb-3">
                        <label for="content" class="form-label">내용</label>
                        <div id="editor" class="content-container"></div>
                        <input type="hidden" id="content" name="content" th:value="${content != null ? content.content : ''}">
<!--                           <textarea id="content" name="content" th:utext="${content != null ? content.content : ''}"></textarea>-->
                    </div>

                    <!-- 기존 첨부 파일 목록 -->
                    <div class="form-group" th:if="${content != null && content.id != null && (content.fileAttachment1 != null || content.fileAttachment2 != null || content.fileAttachment3 != null)}">
                        <label class="form-label">기존 첨부 파일</label>
                        <ul class="list-group mb-3">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:if="${content.fileAttachment1 != null && content.fileAttachment1.originalFilename != null}">
                                <a th:href="@{/custom/download/file/{contentId}/1(contentId=${content.id})}"
                                   th:text="${content.fileAttachment1.originalFilename}"></a>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:if="${content.fileAttachment2 != null && content.fileAttachment2.originalFilename != null}">
                                <a th:href="@{/custom/download/file/{contentId}/2(contentId=${content.id})}"
                                   th:text="${content.fileAttachment2.originalFilename}"></a>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:if="${content.fileAttachment3 != null && content.fileAttachment3.originalFilename != null}">
                                <a th:href="@{/custom/download/file/{contentId}/3(contentId=${content.id})}"
                                   th:text="${content.fileAttachment3.originalFilename}"></a>
                            </li>
                        </ul>
                        <div class="small text-danger">
                            ※ 새 파일을 업로드하면 기존 파일은 삭제됩니다.
                        </div>
                    </div>

                    <!-- 새 첨부 파일 업로드 -->
                    <div class="form-group mb-4">
                        <label class="form-label">첨부 파일</label>
                        <div class="custom-file mb-3">
                            <input type="file" class="custom-file-input" id="file1" name="files">
                            <label class="custom-file-label" for="file1">파일 선택 (선택사항)</label>
                        </div>
                        <div class="custom-file mb-3">
                            <input type="file" class="custom-file-input" id="file2" name="files">
                            <label class="custom-file-label" for="file2">파일 선택 (선택사항)</label>
                        </div>
                        <div class="custom-file mb-3">
                            <input type="file" class="custom-file-input" id="file3" name="files">
                            <label class="custom-file-label" for="file3">파일 선택 (선택사항)</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" class="btn btn-danger" onclick="confirmDelete()">삭제</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 추가 스크립트 -->
    <th:block layout:fragment="script">        
        <script>
            // Toast UI Editor 초기화
            const editor = new toastui.Editor({
                el: document.querySelector('#editor'),
                height: '500px',
                initialEditType: 'wysiwyg',
                previewStyle: 'vertical',
                initialValue: document.querySelector('#content').value || ''
            });

            function submitForm() {
                const content = editor.getMarkdown();
                document.getElementById('content').value = content;
                
                return true;
            }
            
            function confirmDelete() {
                if (confirm('정말로 삭제하시겠습니까?')) {
                    window.location.href = '/custom/delete/type4/' + '[[${menu.id}]]';
                }
            }
            
            $(document).ready(function() {
                // 파일 선택 시 파일명 표시
                $('.custom-file-input').on('change', function() {
                    var fileName = $(this).val().split('\\').pop();
                    $(this).next('.custom-file-label').html(fileName || '파일 선택 (선택사항)');
                });                
            });
        </script>
    </th:block>
</body>
</html>
