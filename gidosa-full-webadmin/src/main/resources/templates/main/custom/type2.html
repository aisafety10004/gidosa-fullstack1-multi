<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title th:text="${menu.name}"></title>
    <style>
        .content-container {
            min-height: 300px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4 mt-4" th:text="${menu.name}"></h2>
        
        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/custom/type2/{menuId}(menuId=${menu.id})}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label for="date" class="form-label">날짜 선택</label>
                        <input type="date" class="form-control" id="date" name="date" 
                               th:value="${#temporals.format(selectedDate, 'yyyy-MM-dd')}" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-secondary w-100">조회</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0" th:text="${#temporals.format(selectedDate, 'yyyy년 MM월 dd일')} + ' 내용'"></h5>
            </div>
            <div class="card-body">
                <form th:action="@{/custom/save/type2/{menuId}(menuId=${menu.id})}" method="post" onsubmit="return submitForm();">
                    <input type="hidden" name="selectedDate" th:value="${#temporals.format(selectedDate, 'yyyy-MM-dd')}">
                    
                    <div class="mb-3">
                        <label for="content" class="form-label">내용</label>
                        <div id="editor" class="content-container"></div>
                        <input type="hidden" id="content" name="content" th:value="${content != null ? content.content : ''}">
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" class="btn btn-danger" onclick="confirmDelete()">삭제</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <th:block layout:fragment="script">
        <script>
            // document.addEventListener('DOMContentLoaded', function() {
            //     // Toast UI Editor 초기화
            //     const editor = new toastui.Editor({
            //         el: document.querySelector('#editor'),
            //         height: '500px',
            //         initialEditType: 'wysiwyg',
            //         previewStyle: 'vertical',
            //         initialValue: document.querySelector('#content').value || ''
            //     });
                
            //     // 폼 제출 시 에디터 내용을 hidden input에 설정
            //     document.querySelector('form').addEventListener('submit', function(e) {
            //         e.preventDefault(); // 폼 제출을 일시 중지
            //         document.querySelector('#content').value = editor.getHTML();
            //         this.submit(); // 수동으로 폼 제출
            //     });
            // });

            // Toast UI Editor 초기화
            const editor = new toastui.Editor({
                el: document.querySelector('#editor'),
                height: '500px',
                initialEditType: 'wysiwyg',
                previewStyle: 'vertical',
                initialValue: document.querySelector('#content').value || ''
            });

            function submitForm() {
                const content = editor.getMarkdown();
                document.getElementById('content').value = content;

                return true;
            }

            function confirmDelete() {
                if (confirm('정말로 삭제하시겠습니까?')) {
                    const selectedDate = document.querySelector('input[name="selectedDate"]').value;
                    window.location.href = '/custom/delete/type2/' + '[[${menu.id}]]' + '?date=' + selectedDate;
                }
            }
        </script>
    </th:block>
</body>
</html>
