<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${layout}}"
>
<head>
    <meta charset="UTF-8">
    <title>의견제출 상세보기</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <div class="card shadow mb-4 mt-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">의견제출 상세보기</h6>
                    <div>
                        <a th:if="${isAdmin}" th:href="@{/inquiry/admin/list}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-list"></i> 목록으로
                        </a>
                        <a th:unless="${isAdmin}" th:href="@{/inquiry/list(constructionId=${constructionId})}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-list"></i> 목록으로
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <!-- 알림 메시지 표시 -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <!-- 문의사항 정보 -->
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="m-0 font-weight-bold text-primary">의견제출 정보</h6>
                            <div>
                                <span th:if="${inquiryAdmin.isPrivate}" class="badge badge-secondary mr-2">비공개</span>
                                <span th:if="${inquiryAdmin.answered}" class="badge badge-success">답변 완료</span>
                                <span th:unless="${inquiryAdmin.answered}" class="badge badge-warning">답변 대기</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <h5 th:text="${inquiryAdmin.title}" class="font-weight-bold"></h5>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <strong>의견제출자:</strong> <span th:text="${inquiryAdmin.inquirerName}"></span>
                                </div>
                                <div class="col-md-4">
                                    <strong>이메일:</strong> <span th:text="${inquiryAdmin.inquirerEmail}"></span>
                                </div>
                                <div class="col-md-4">
                                    <strong>연락처:</strong> <span th:text="${inquiryAdmin.inquirerPhone}"></span>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <!-- <div class="col-md-4">
                                    <strong>문의 유형:</strong> <span th:text="${inquiryAdmin.inquiryType}"></span>
                                </div> -->
                                <div class="col-md-4">
                                    <strong>의견제출일:</strong> <span th:text="${#temporals.format(inquiryAdmin.inquiryDate, 'yyyy-MM-dd HH:mm')}"></span>
                                </div>
                                <!-- <div class="col-md-4">
                                    <strong>건설현장:</strong> <span th:text="${inquiryAdmin.construction.name}"></span>
                                </div> -->
                            </div>
                            <hr>
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <div class="card">
                                        <div class="card-header">
                                            <h6 class="m-0 font-weight-bold">의견제출 내용</h6>
                                        </div>
                                        <div class="card-body">
                                            <div th:utext="${inquiryAdmin.content}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 첨부 파일 목록 -->
                            <div class="row mb-3" th:if="${not #lists.isEmpty(inquiryAdmin.attachments)}">
                                <div class="col-md-12">
                                    <div class="card">
                                        <div class="card-header">
                                            <h6 class="m-0 font-weight-bold">첨부 파일</h6>
                                        </div>
                                        <div class="card-body">
                                            <ul class="list-group">
                                                <li class="list-group-item" th:if="${inquiryAdmin.fileAttachment1 != null}">
                                                    <a th:href="@{/inquiry/download/{id}/1(id=${inquiryAdmin.id})}"
                                                       th:text="${inquiryAdmin.fileAttachment1.originalFilename}"></a>
                                                </li>
                                                <li class="list-group-item" th:if="${inquiryAdmin.fileAttachment2 != null}">
                                                    <a th:href="@{/inquiry/download/{id}/2(id=${inquiryAdmin.id})}"
                                                       th:text="${inquiryAdmin.fileAttachment2.originalFilename}"></a>
                                                </li>
                                                <li class="list-group-item" th:if="${inquiryAdmin.fileAttachment3 != null}">
                                                    <a th:href="@{/inquiry/download/{id}/3(id=${inquiryAdmin.id})}"
                                                       th:text="${inquiryAdmin.fileAttachment3.originalFilename}"></a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 답변 정보 -->
                    <div class="card mb-4" th:if="${inquiryAdmin.answered}">
                        <div class="card-header">
                            <h6 class="m-0 font-weight-bold text-primary">답변 정보</h6>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <strong>답변일:</strong> <span th:text="${#temporals.format(inquiryAdmin.answerDate, 'yyyy-MM-dd HH:mm')}"></span>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <div class="card">
                                        <div class="card-header">
                                            <h6 class="m-0 font-weight-bold">답변 내용</h6>
                                        </div>
                                        <div class="card-body">
                                            <div th:utext="${inquiryAdmin.answerContent}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 답변 작성/수정 폼 -->
                    <div class="card mb-4" th:if="${isAdmin}">
                        <div class="card-header">
                            <h6 class="m-0 font-weight-bold text-primary" th:text="${inquiryAdmin.answered ? '답변 수정' : '답변 작성'}" th:if="${isAdmin}"></h6>
                            <!-- <h6 class="m-0 font-weight-bold text-primary" th:text="관리자가 답변한 내용" th:unless="${isAdmin}"></h6> -->
                        </div>
                        <div class="card-body">
                            <form th:action="@{/inquiry/answer/{id}(id=${inquiryAdmin.id})}" method="post">
                                <input type="hidden" name="constructionId" th:value="${constructionId}">
                                <div class="form-group">
                                    <textarea name="answerContent" id="answerContent" rows="5" class="form-control" required
                                        th:text="${inquiryAdmin.answerContent}" th:if="${isAdmin}"></textarea>
                                    <textarea name="answerContent" id="answerContent" rows="5" class="form-control"
                                        th:text="${inquiryAdmin.answerContent}" th:unless="${isAdmin}" readonly></textarea>
                                </div>
                                <div class="text-right mt-3" th:if="${isAdmin}">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save"></i> 
                                        <span th:text="${inquiryAdmin.answered ? '답변 수정' : '답변 등록'}"></span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <!-- 버튼 영역 -->
                    <div class="d-flex justify-content-between">
                        <div>
                            <a th:if="${isAdmin}" th:href="@{/inquiry/admin/list}" class="btn btn-secondary">
                                <i class="fas fa-list"></i> 목록으로
                            </a>
                            <a th:unless="${isAdmin}" th:href="@{/inquiry/list(constructionId=${constructionId})}" class="btn btn-secondary">
                                <i class="fas fa-list"></i> 목록으로
                            </a>
                        </div>
                        <div>
                            <a th:unless="${isAdmin}" th:href="@{/inquiry/edit/{id}(id=${inquiryAdmin.id}, constructionId=${constructionId})}" class="btn btn-primary mr-2">
                                <i class="fas fa-edit"></i> 수정 화면으로 이동
                            </a>
                            <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal">
                                <i class="fas fa-trash"></i> 삭제
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 삭제 확인 모달 -->
        <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true" data-backdrop="static">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteModalLabel">의견제출 삭제</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="closeModalBtn" onclick="$('#deleteModal').modal('hide');">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        정말로 이 의견제출을 삭제하시겠습니까?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal" id="cancelModalBtn" onclick="$('#deleteModal').modal('hide');">취소</button>
                        <form th:action="@{/inquiry/delete/{id}(id=${inquiryAdmin.id})}" method="post">
                            <input type="hidden" name="constructionId" th:value="${constructionId}">
                            <button type="submit" class="btn btn-danger">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <th:block layout:fragment="script">
        <script>
            $(document).ready(function() {
                // 입력 필드 초기화
                if ($("#answerContent").val() === "null") {
                    $("#answerContent").val("");
                }

                // 알림 닫기 버튼 이벤트 처리
                $('.alert .close').on('click', function() {
                    $(this).closest('.alert').alert('close');
                });
                
                // 모달 초기화
                $('#deleteModal').modal({
                    show: false,
                    backdrop: 'static',
                    keyboard: false
                });
                
                // 삭제 버튼 이벤트 처리
                $('.btn-danger[data-target="#deleteModal"]').on('click', function(e) {
                    e.preventDefault();
                    console.log('삭제 버튼 클릭됨');
                    $('#deleteModal').modal('show');
                });
                
                // 모달 닫기 버튼 이벤트 처리
                $('#closeModalBtn, #cancelModalBtn').on('click', function(e) {
                    e.preventDefault();
                    console.log('모달 닫기 버튼 클릭됨');
                    $('#deleteModal').modal('hide');
                });
                
                // ESC 키 처리
                $(document).on('keydown', function(e) {
                    if (e.keyCode === 27 && $('#deleteModal').hasClass('show')) { // ESC 키
                        $('#deleteModal').modal('hide');
                    }
                });
            });
        </script>
    </th:block>
</body>
</html>
