<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${layout}}">
<head>
    <!-- <title>HTML 페이지 생성</title> -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/lang/summernote-ko-KR.min.js"></script>
</head>
<body>
<div layout:fragment="content">
    <!-- 페이지 제목 -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4 mt-3">
        <!-- <h1 class="h3 mb-0 text-gray-800">HTML 페이지 생성</h1> -->
        <a th:href="@{/settings/html-manager(viewMode=${viewMode})}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
            <i class="fas fa-list fa-sm text-white-50"></i> 목록으로
        </a>
    </div>

    <!-- 알림 메시지 -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <!-- HTML 페이지 생성 폼 -->
    <div class="card shadow mb-4">
        <!-- <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">HTML 페이지 정보 입력</h6>
        </div> -->
        <div class="card-body">
            <form th:action="@{/settings/html-manager/create}" method="post" enctype="multipart/form-data" id="createForm" th:object="${htmlPageDTO}">
                <div class="form-group mb-3">
                    <label for="title">제목 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                
                <div class="form-group mb-3">
                    <label for="content">페이지 설명(옵션)</label>
                    <textarea class="form-control" id="content" th:field="*{content}" rows="10"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                </div>
                
                <!-- Construction 정보 표시 (관리자만 변경 가능) -->
                <!-- <div class="form-group mb-3" th:if="${#authentication.principal.authorities.![authority].contains('ROLE_ADMIN')}">
                    <label for="constructionId">소속 공사</label>
                    <select class="form-control" id="constructionId" name="constructionId">
                        <option value="">전체 공통 HTML 페이지</option>
                        <option th:each="construction : ${constructionList}" 
                                th:value="${construction.id}" 
                                th:text="${construction.name}">공사명</option>
                    </select>
                    <small class="form-text text-muted">
                        전체 공통은 모든 매니저가 볼 수 있습니다. 특정 공사를 선택하면 해당 공사 소속 매니저만 볼 수 있습니다.
                    </small>
                </div> -->
                
                <!-- 매니저의 경우 자신의 소속 공사 정보 표시 (변경 불가) -->
                <div class="form-group mb-3" th:unless="${#authentication.principal.authorities.![authority].contains('ROLE_ADMIN')}">
                    <!-- <label>소속 공사</label>
                    <p class="form-control-static" th:if="${#authentication.principal.memberAdmin != null && #authentication.principal.memberAdmin.construction != null}" 
                       th:text="${#authentication.principal.memberAdmin.construction.name}">공사명</p>
                    <p class="form-control-static" th:unless="${#authentication.principal.memberAdmin != null && #authentication.principal.memberAdmin.construction != null}">
                        소속 공사 정보가 없습니다.
                    </p> -->
                    <input type="hidden" name="constructionId" th:if="${#authentication.principal.memberAdmin != null && #authentication.principal.memberAdmin.construction != null}"
                           th:value="${#authentication.principal.memberAdmin.construction.id}">
                </div>
                
                <div class="form-group mb-3">
                    <label for="htmlFile">파일 업로드 <span class="text-danger">*</span></label>
                    <div class="custom-file">
                        <!-- <label class="custom-file-label" for="htmlFile">파일을 선택하세요</label>
                        <br> -->
                        <input type="file" class="custom-file-input" id="htmlFile" name="htmlFile" accept=".html,.htm" required>
                        <br>
                        <small class="form-text text-muted">
                            ※ .html 또는 .htm 확장자를 가진 파일만 업로드할 수 있습니다.
                        </small>
                    </div>
                </div>
                
                <div class="form-group mb-3">
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="published" th:field="*{published}">
                        <label class="custom-control-label" for="published">게시하기</label>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> 생성하기
                    </button>
                    <a th:href="@{/settings/html-manager?(viewMode=${viewMode})}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> 취소
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // summernote 에디터 초기화
            // $('#content').summernote({
            //     lang: 'ko-KR',
            //     height: 400,
            //     toolbar: [
            //         ['style', ['style']],
            //         ['font', ['bold', 'underline', 'clear']],
            //         ['color', ['color']],
            //         ['para', ['ul', 'ol', 'paragraph']],
            //         ['table', ['table']],
            //         ['insert', ['link', 'picture']],
            //         ['view', ['fullscreen', 'codeview', 'help']]
            //     ],
            //     callbacks: {
            //         onImageUpload: function(files) {
            //             // 이미지 업로드 처리를 위한 콜백 (필요시 구현)
            //             alert('이미지는 HTML 코드에 직접 첨부할 수 없습니다. 외부 이미지 URL을 사용하시기 바랍니다.');
            //         }
            //     }
            // });
            
            // 파일 업로드 필드 커스텀 UI
            $('.custom-file-input').on('change', function() {
                var fileName = $(this).val().split('\\').pop();
                $(this).next('.custom-file-label').html(fileName);
                
                // 파일 확장자 확인
                var fileExtension = fileName.split('.').pop().toLowerCase();
                if (fileExtension !== 'html' && fileExtension !== 'htm') {
                    alert('HTML 파일(.html, .htm)만 업로드할 수 있습니다.');
                    $(this).val('');
                    $(this).next('.custom-file-label').html('파일을 선택하세요');
                }
            });
            
            // 폼 제출 전 유효성 검증
            $('#createForm').on('submit', function(e) {
                var title = $('#title').val().trim();
                
                if (title === '') {
                    e.preventDefault();
                    alert('제목을 입력해주세요.');
                    $('#title').focus();
                    return false;
                }
                
                return true;
            });

            // 알림 메시지 닫기 버튼 이벤트 추가
            document.querySelectorAll('.alert .close').forEach(function(closeBtn) {
                closeBtn.addEventListener('click', function() {
                    var alert = this.closest('.alert');
                    alert.classList.remove('show');
                    setTimeout(function() {
                        alert.style.display = 'none';
                    }, 150);
                });
            });
        });
    </script>
</div>
</body>
</html>
