<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${layout}}">
<head>
    <!-- <title>HTML 페이지 상세</title> -->
</head>
<body>
<div layout:fragment="content">
    <!-- 페이지 제목 -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4 mt-3">
        <h1 class="h3 mb-0 text-gray-800">HTML 페이지 상세</h1>
        <div>
            <a th:href="@{/settings/html-manager}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm mr-2">
                <i class="fas fa-list fa-sm text-white-50"></i> 목록으로
            </a>
            <!-- <a th:href="@{/settings/html-manager/update/{id}(id=${htmlPage.id})}" class="d-none d-sm-inline-block btn btn-sm btn-info shadow-sm mr-2">
                <i class="fas fa-edit fa-sm text-white-50"></i> 수정
            </a> -->
            <button type="button" class="d-none d-sm-inline-block btn btn-sm btn-danger shadow-sm" data-bs-toggle="modal" data-bs-target="#deleteModal">
                <i class="fas fa-trash fa-sm text-white-50"></i> 삭제
            </button>
        </div>
    </div>

    <!-- 알림 메시지 -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="close" data-bs-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="close" data-bs-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <!-- HTML 페이지 상세 정보 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">HTML 페이지 정보</h6>
            <div>
                <form th:if="${htmlPage.published}" th:action="@{/settings/html-manager/publish/{id}(id=${htmlPage.id})}" method="post" class="d-inline">
                    <input type="hidden" name="publish" value="false">
                    <button type="submit" class="btn btn-sm btn-warning">
                        <i class="fas fa-eye-slash"></i> 게시 해제
                    </button>
                </form>
                <form th:unless="${htmlPage.published}" th:action="@{/settings/html-manager/publish/{id}(id=${htmlPage.id})}" method="post" class="d-inline">
                    <input type="hidden" name="publish" value="true">
                    <button type="submit" class="btn btn-sm btn-success">
                        <i class="fas fa-eye"></i> 게시하기
                    </button>
                </form>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-bordered">
                <tr>
                    <th style="width: 20%" class="bg-light">제목</th>
                    <td th:text="${htmlPage.title}"></td>
                </tr>
                <tr>
                    <th class="bg-light">게시 상태</th>
                    <td>
                        <span th:if="${htmlPage.published}" class="">게시</span>
                        <span th:unless="${htmlPage.published}" class="">미게시</span>
                    </td>
                </tr>
                <tr>
                    <th class="bg-light">등록일</th>
                    <td th:text="${#temporals.format(htmlPage.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>
                <tr>
                    <th class="bg-light">수정일</th>
                    <td th:text="${#temporals.format(htmlPage.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>
                <tr>
                    <th class="bg-light">HTML 파일</th>
                    <td>
                        <span th:if="${htmlPage.htmlFile != null}">
                            <span th:text="${htmlPage.htmlFile.originalFilename}"></span>
                            <!-- <span class="text-muted ml-2">(<span th:text="${#numbers.formatDecimal(htmlPage.htmlFile.fileSize / 1024, 0, 1)}">0.0</span> KB)</span> -->
                            <span class="text-muted ml-2">(<span th:text="${#numbers.formatInteger(htmlPage.htmlFile.fileSize, 3, 'COMMA')}">0</span> byte)</span>
                        </span>
                        <span th:unless="${htmlPage.htmlFile != null}" class="text-muted">첨부된 HTML 파일이 없습니다.</span>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- HTML 페이지 내용 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">HTML 페이지 내용</h6>
        </div>
        <div class="card-body">
            <div class="html-content" th:utext="${htmlPage.content}"></div>
        </div>
    </div>

    <!-- HTML 파일 미리보기 (파일이 있는 경우) -->
    <div class="card shadow mb-4" th:if="${htmlPage.htmlFile != null}">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">HTML 파일 미리보기</h6>
        </div>
        <div class="card-body">
            <div class="embed-responsive embed-responsive-16by9">
<!--                <iframe class="embed-responsive-item" th:src="@{/file-viewer/html-view/{id}(id=${htmlPage.htmlFile.id})}" width="100%" height="300" allowfullscreen></iframe>-->
                <iframe class="embed-responsive-item" th:src="@{/file-viewer/html-view/{id}(id=${htmlPage.htmlFile.storedFilename})}" width="100%" height="300" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">HTML 페이지 삭제</h5>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    정말 이 HTML 페이지를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <form th:action="@{/settings/html-manager/delete/{id}(id=${htmlPage.id})}" method="post">
                        <button type="submit" class="btn btn-danger">삭제</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <style>
        .html-content {
            background-color: #f8f9fc;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #e3e6f0;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
    
    <script>
        // 부트스트랩 5에서는 data-bs-dismiss 속성이 자동으로 알림과 모달을 처리합니다.
    </script>
</div>
</body>
</html>
