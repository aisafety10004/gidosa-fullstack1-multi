<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${layout}}">
<head>
    <!-- <title>HTML 페이지 수정</title> -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-bs4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/lang/summernote-ko-KR.min.js"></script>
</head>
<body>
<div layout:fragment="content">
    <!-- 페이지 제목 -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4 mt-3">
        <h1 class="h3 mb-0 text-gray-800">HTML 페이지 수정</h1>
        <div>
            <a th:href="@{/settings/html-manager}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm mr-2">
                <i class="fas fa-list fa-sm text-white-50"></i> 목록으로
            </a>
            <a th:href="@{/settings/html-manager/detail/{id}(id=${htmlPage.id})}" class="d-none d-sm-inline-block btn btn-sm btn-info shadow-sm">
                <i class="fas fa-eye fa-sm text-white-50"></i> 상세보기
            </a>
        </div>
    </div>

    <!-- 알림 메시지 -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <!-- HTML 페이지 수정 폼 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">HTML 페이지 정보 수정</h6>
        </div>
        <div class="card-body">
            <form th:action="@{/settings/html-manager/update/{id}(id=${htmlPage.id})}" method="post" enctype="multipart/form-data" id="updateForm" th:object="${htmlPageDTO}">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-group">
                    <label for="title">제목 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                
                <div class="form-group mb-3">
                    <label for="content">HTML 페이지 내용</label>
                    <textarea class="form-control" id="content" th:field="*{content}" rows="10"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                </div>
                
                <!-- Construction 정보 표시 (관리자만 변경 가능) -->
                <!-- <div class="form-group mb-3" th:if="${#authentication.principal.authorities.![authority].contains('ROLE_ADMIN')}">
                    <label for="constructionId">소속 공사</label>
                    <select class="form-control" id="constructionId" name="constructionId">
                        <option value="">전체 공통 HTML 페이지</option>
                        <option th:each="construction : ${constructionList}" 
                                th:value="${construction.id}" 
                                th:text="${construction.name}"
                                th:selected="${construction.id == htmlPageDTO.constructionId}">공사명</option>
                    </select>
                    <small class="form-text text-muted">
                        전체 공통은 모든 매니저가 볼 수 있습니다. 특정 공사를 선택하면 해당 공사 소속 매니저만 볼 수 있습니다.
                    </small>
                </div> -->
                
                <!-- 매니저의 경우 자신의 소속 공사 정보 표시 (변경 불가) -->
                <div class="form-group mb-3" th:unless="${#authentication.principal.authorities.![authority].contains('ROLE_ADMIN')}">
                    <!-- <label>소속 공사</label>
                    <p class="form-control-static" th:if="${#authentication.principal.memberAdmin != null && #authentication.principal.memberAdmin.construction != null}" 
                       th:text="${#authentication.principal.memberAdmin.construction.name}">공사명</p>
                    <p class="form-control-static" th:unless="${#authentication.principal.memberAdmin != null && #authentication.principal.memberAdmin.construction != null}">
                        소속 공사 정보가 없습니다.
                    </p> -->
                    <input type="hidden" name="constructionId" th:if="${#authentication.principal.memberAdmin != null && #authentication.principal.memberAdmin.construction != null}"
                           th:value="${#authentication.principal.memberAdmin.construction.id}">
                </div>
                
                <!-- 기존 HTML 파일 표시 및 새 파일 업로드 -->
                <div class="form-group">
                    <label>HTML 파일</label>
                    <div class="card mb-3" th:if="${htmlPage.htmlFile != null}">
                        <div class="card-body py-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fas fa-file-code text-primary mr-2"></i>
                                    <span th:text="${htmlPage.htmlFile.originalFilename}"></span>
                                    <!-- <span class="text-muted ml-2">(<span th:text="${#numbers.formatDecimal(htmlPage.htmlFile.fileSize / 1024, 0, 1)}">0.0</span> KB)</span> -->
                                    <span class="text-muted ml-2">(<span th:text="${#numbers.formatInteger(htmlPage.htmlFile.fileSize, 3, 'COMMA')}">0</span> byte)</span>
                                </div>
                                <form th:action="@{/settings/html-manager/html-file/{id}/remove(id=${htmlPage.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('HTML 파일을 제거하시겠습니까?')">
                                        <i class="fas fa-times"></i> 제거
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="htmlFile">새 HTML 파일 업로드</label>
                    <div class="custom-file">
                        <!-- <label class="custom-file-label" for="htmlFile">파일을 선택하세요</label>
                        <br> -->
                        <input type="file" class="custom-file-input" id="htmlFile" name="htmlFile" accept=".html,.htm">
                        <br>
                        <small class="form-text text-muted">
                            ※ .html 또는 .htm 확장자를 가진 파일만 업로드할 수 있습니다.
                            <span th:if="${htmlPage.htmlFile != null}" class="text-danger">새 파일을 업로드하면 기존 파일은 대체됩니다.</span>
                        </small>                        
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="published" th:field="*{published}">
                        <label class="custom-control-label" for="published">게시하기</label>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" id="saveButton">
                        <i class="fas fa-save"></i> 저장하기
                    </button>
                    <a th:href="@{/settings/html-manager/detail/{id}(id=${htmlPage.id})}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> 취소
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 디버깅용 콘솔 로그
            console.log('폼 초기화됨: ', $('#updateForm').length > 0 ? '폼 존재' : '폼 없음');
            
            // 폼 직접 제출 처리
            $('#saveButton').on('click', function(e) {
                console.log('저장하기 버튼 클릭됨');
                
                // Summernote 에디터 내용을 textarea에 복사
                var content = $('#content').summernote('code');
                $('#content').val(content);
                
                console.log('폼 제출 준비:', {
                    'title': $('#title').val(),
                    'content_length': content ? content.length : 0,
                    'published': $('#published').is(':checked')
                });
                
                // form 제출을 지연시켜 내용이 확실히 복사되도록 함
                setTimeout(function() {
                    $('#updateForm').submit();
                }, 100);
                
                e.preventDefault(); // 기본 클릭 이벤트 방지
            });
            
            // summernote 에디터 초기화
            // $('#content').summernote({
            //     lang: 'ko-KR',
            //     height: 400,
            //     toolbar: [
            //         ['style', ['style']],
            //         ['font', ['bold', 'underline', 'clear']],
            //         ['color', ['color']],
            //         ['para', ['ul', 'ol', 'paragraph']],
            //         ['table', ['table']],
            //         ['insert', ['link', 'picture']],
            //         ['view', ['fullscreen', 'codeview', 'help']]
            //     ],
            //     callbacks: {
            //         onImageUpload: function(files) {
            //             // 이미지 업로드 처리를 위한 콜백 (필요시 구현)
            //             alert('이미지는 HTML 코드에 직접 첨부할 수 없습니다. 외부 이미지 URL을 사용하시기 바랍니다.');
            //         }
            //     }
            // });
            
            // 파일 업로드 필드 커스텀 UI
            $('.custom-file-input').on('change', function() {
                var fileName = $(this).val().split('\\').pop();
                $(this).next('.custom-file-label').html(fileName);
                
                // 파일 확장자 확인
                var fileExtension = fileName.split('.').pop().toLowerCase();
                if (fileExtension !== 'html' && fileExtension !== 'htm') {
                    alert('HTML 파일(.html, .htm)만 업로드할 수 있습니다.');
                    $(this).val('');
                    $(this).next('.custom-file-label').html('파일을 선택하세요');
                }
            });
            
            // 폼 제출 전 유효성 검증
            $('#updateForm').on('submit', function(e) {
                console.log('폼 제출 이벤트 발생');
                var title = $('#title').val().trim();
                var content = $('#content').val().trim();
                
                if (title === '') {
                    e.preventDefault();
                    alert('제목을 입력해주세요.');
                    $('#title').focus();
                    return false;
                }
                
                // if (content === '') {
                //     e.preventDefault();
                //     alert('HTML 페이지 내용을 입력해주세요.');
                //     $('#content').summernote('focus');
                //     return false;
                // }
                
                // 중복 클릭 방지
                $('#saveButton').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 저장 중...');
                
                return true;
            });

            // 알림 메시지 닫기 버튼 이벤트 추가
            document.querySelectorAll('.alert .close').forEach(function(closeBtn) {
                closeBtn.addEventListener('click', function() {
                    var alert = this.closest('.alert');
                    alert.classList.remove('show');
                    setTimeout(function() {
                        alert.style.display = 'none';
                    }, 150);
                });
            });
        });
    </script>
</div>
</body>
</html>
