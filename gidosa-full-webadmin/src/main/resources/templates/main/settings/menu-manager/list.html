<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>메뉴 관리</title>
    <style>
        .menu-item {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .menu-item:hover {
            background-color: #f0f0f0;
        }
        .child-menu {
            margin-left: 30px;
            margin-top: 10px;
        }
        .menu-type-badge {
            font-size: 0.8rem;
        }
        .menu-actions {
            display: flex;
            gap: 5px;
        }
        .construction-badge {
            font-size: 0.8rem;
            background-color: #6c757d;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">메뉴 관리</h2>
        
        <!-- 메시지 표시 -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <!-- 새 메뉴 등록 버튼 -->
        <div class="mb-3">
            <a th:href="@{/settings/menu-manager/create}" class="btn btn-primary">새 메뉴 등록</a>
        </div>
        
        <!-- 메뉴 목록 -->
        <div class="card">
            <div class="card-body">
                <div th:if="${rootMenus.isEmpty()}" class="text-center py-4">
                    <p>등록된 메뉴가 없습니다. 새 메뉴를 등록해주세요.</p>
                </div>
                
                <div th:unless="${rootMenus.isEmpty()}">
                    <div th:each="menu : ${rootMenus}" class="menu-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <!-- 관리자인 경우 건설현장 이름 표시 -->
                                <span th:if="${isAdmin}" class="badge construction-badge" th:text="${menu.construction.name}"></span>
                                <h5 th:text="${menu.name}" class="mb-0 d-inline"></h5>
                                <small th:text="${menu.url}" class="text-muted"></small>
                                <span th:if="${menu.menuType == 1}" class="badge bg-info menu-type-badge ms-2">타입1: 단건 내용</span>
                                <span th:if="${menu.menuType == 2}" class="badge bg-warning menu-type-badge ms-2">타입2: 날짜</span>
                                <small th:text="|활성화: ${menu.isActive}|" class="text-muted"></small>
                            </div>
                            <div class="menu-actions">
                                <a th:href="@{/settings/menu-manager/edit/{id}(id=${menu.id})}" class="btn btn-sm btn-warning">수정</a>
                                <form th:action="@{/settings/menu-manager/delete/{id}(id=${menu.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('정말 삭제하시겠습니까? 하위 메뉴도 모두 삭제됩니다.');">삭제</button>
                                </form>
                                <a th:href="@{/settings/menu-manager/create(parentId=${menu.id})}" class="btn btn-sm btn-secondary">하위메뉴 추가</a>
                            </div>
                        </div>
                        
                        <!-- 하위 메뉴 표시 -->
                        <div th:if="${!menu.children.isEmpty()}" class="child-menu">
                            <div th:each="childMenu : ${menu.children}" class="menu-item">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 th:text="${childMenu.name}" class="mb-0"></h6>
                                        <small th:text="${childMenu.url}" class="text-muted"></small>
                                        <span th:if="${childMenu.menuType == 1}" class="badge bg-info menu-type-badge ms-2">타입1: 단건 내용</span>
                                        <span th:if="${childMenu.menuType == 2}" class="badge bg-warning menu-type-badge ms-2">타입2: 날짜</span>
                                    </div>
                                    <div class="menu-actions">
                                        <a th:href="@{/settings/menu-manager/edit/{id}(id=${childMenu.id})}" class="btn btn-sm btn-warning">수정</a>
                                        <form th:action="@{/settings/menu-manager/delete/{id}(id=${childMenu.id})}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
