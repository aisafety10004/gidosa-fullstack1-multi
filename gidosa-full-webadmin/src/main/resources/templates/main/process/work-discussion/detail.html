<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>업무협의 상세</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">업무협의 상세(<span th:text="${workDiscussion.groupName}"></span>)</h2>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${workDiscussion.title}"></h5>
                <div class="mb-3">
                    <small class="text-muted">
                        협의일자: <span th:text="${#temporals.format(workDiscussion.discussionDate, 'yyyy-MM-dd HH:mm')}"></span>
                        <br>
                        등록일: <span th:text="${#temporals.format(workDiscussion.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        | 수정일: <span th:text="${#temporals.format(workDiscussion.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                        <br>
                        건설현장: 
                        <span th:if="${workDiscussion.construction != null}" th:text="${workDiscussion.construction.name + ' (' + workDiscussion.construction.location + ')'}"></span>
                        <span th:if="${workDiscussion.construction == null}" class="badge bg-primary">전체 업무협의</span>
                        <br>
                        그룹: <span class="badge bg-info" th:text="${workDiscussion.groupName}"></span>
                    </small>
                </div>
                
                <!-- Mermaid 다이어그램 표시 영역 -->
                <div th:if="${workDiscussion.mermaidCode != null && !workDiscussion.mermaidCode.isEmpty()}" class="mt-4">
                    <h6>Mermaid 다이어그램</h6>
                    <div class="mermaid-diagram-container">
                        <div class="mermaid" th:text="${workDiscussion.mermaidCode}"></div>
                    </div>
                </div>

                <!-- 내용 표시 영역 -->
                <div id="viewer"></div>

                <div class="mt-3" th:if="${!workDiscussion.attachments.empty}">
                    <h6>첨부파일</h6>
                    <ul class="list-unstyled">
                        <li th:each="attachment : ${workDiscussion.attachments}">
                            <a th:href="@{/common/file/download/{id}(id=${attachment.id})}"
                               th:text="${attachment.originalFilename}"></a>
                            <span class="text-muted">
                                (<span th:text="${#numbers.formatDecimal(attachment.fileSize/1024, 0, 'COMMA', 2, 'POINT')}">
                                </span> KB)
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/process/work-discussion/list(groupName=${workDiscussion.groupName})}" class="btn btn-secondary">목록으로</a>
            <a th:href="@{/process/work-discussion/update/{id}(id=${workDiscussion.id})}" class="btn btn-warning"
                th:if="${(workDiscussion.construction != null && #authentication.principal.memberAdmin.construction != null && #authentication.principal.memberAdmin.construction.id == workDiscussion.construction.id) 
                || #authentication.principal.authorities.![authority].contains('ROLE_ADMIN')}"
            >수정</a>
            <form th:action="@{/process/work-discussion/delete/{id}(id=${workDiscussion.id})}" 
                  method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger"
                        th:if="${(workDiscussion.construction != null && #authentication.principal.memberAdmin.construction != null && #authentication.principal.memberAdmin.construction.id == workDiscussion.construction.id)
                        || #authentication.principal.authorities.![authority].contains('ROLE_ADMIN')}"
                        onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
            </form>
        </div>
    </div>

    <th:block layout:fragment="script">
    <script src="/js/mermaid/mermaid.min.js"></script>
    <script th:inline="javascript">
        const content = /*[[${workDiscussion.content}]]*/ '';
        const viewer = new toastui.Editor.factory({
            el: document.querySelector('#viewer'),
            viewer: true,
            initialValue: content
        });

        // Mermaid 초기화 및 렌더링
        document.addEventListener("DOMContentLoaded", function () {
            mermaid.initialize({ startOnLoad: true });
        });
    </script>
    </th:block>
</body>
</html>
