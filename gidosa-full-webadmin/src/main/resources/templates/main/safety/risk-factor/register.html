<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/manager}">
<head>
    <title>위험요인 등록</title>
    <style>
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h5 {
            margin-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }
        
        .required-label::after {
            content: " *";
            color: red;
        }
        
        /* 반응형 스타일 */
        @media (max-width: 768px) {
            .form-section .row {
                flex-direction: column;
            }
            
            .form-section .col-md-6 {
                width: 100%;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4">
        <h1 class="mt-4">위험요인 등록</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/main">홈</a></li>
            <li class="breadcrumb-item"><a href="/safety/risk-factor/list">위험요인 관리</a></li>
            <li class="breadcrumb-item active">위험요인 등록</li>
        </ol>
        
        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-edit me-1"></i>
                위험요인 등록 양식
            </div>
            <div class="card-body">
                <form th:action="@{/safety/risk-factor/register}" method="post" th:object="${riskFactorDto}">
                    <!-- 기본 정보 섹션 -->
                    <div class="form-section">
                        <h5>기본 정보</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label required-label">현장명</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="locationDetail" class="form-label">위치 상세</label>
                                <input type="text" class="form-control" id="locationDetail" th:field="*{locationDetail}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startDate" class="form-label required-label">시작일</label>
                                <input type="date" class="form-control" id="startDate" th:field="*{startDate}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endDate" class="form-label required-label">종료일</label>
                                <input type="date" class="form-control" id="endDate" th:field="*{endDate}" required>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 상태 및 위험도 섹션 -->
                    <div class="form-section">
                        <h5>상태 및 위험도</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label required-label">상태</label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option value="">-- 상태 선택 --</option>
                                    <option th:each="statusOption : ${statusOptions}"
                                            th:value="${statusOption}"
                                            th:text="${statusOption.displayName}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="riskLevel" class="form-label">위험도</label>
                                <select class="form-select" id="riskLevel" th:field="*{riskLevel}">
                                    <option value="">-- 위험도 선택 --</option>
                                    <option th:each="riskLevelOption : ${riskLevelOptions}"
                                            th:value="${riskLevelOption}"
                                            th:text="${riskLevelOption.displayName}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 상세 설명 섹션 -->
                    <div class="form-section">
                        <h5>상세 설명</h5>
                        <div class="mb-3">
                            <label for="description" class="form-label">설명</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="5"></textarea>
                        </div>
                    </div>
                    
                    <!-- 버튼 그룹 -->
                    <div class="d-flex justify-content-center mt-4">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="fas fa-save"></i> 등록
                        </button>
                        <a th:href="@{/safety/risk-factor/list}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> 취소
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 날짜 유효성 검사
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');
            
            function validateDates() {
                if (startDateInput.value && endDateInput.value) {
                    const startDate = new Date(startDateInput.value);
                    const endDate = new Date(endDateInput.value);
                    
                    if (endDate < startDate) {
                        endDateInput.setCustomValidity('종료일은 시작일 이후여야 합니다.');
                    } else {
                        endDateInput.setCustomValidity('');
                    }
                }
            }
            
            startDateInput.addEventListener('change', validateDates);
            endDateInput.addEventListener('change', validateDates);
            
            // 폼 제출 전 유효성 검사
            document.querySelector('form').addEventListener('submit', function(event) {
                validateDates();
                
                if (!this.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                
                this.classList.add('was-validated');
            });
        });
    </script>
</th:block>
</body>
</html>
