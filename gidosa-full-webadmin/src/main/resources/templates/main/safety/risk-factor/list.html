<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/manager}">
<head>
    <title>위험요인 관리</title>
    <style>
        .search-form {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .search-form .form-group {
            margin-bottom: 15px;
        }
        
        .search-form .btn-group {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        
        .search-form .btn-group .btn {
            margin: 0 5px;
        }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .status-PENDING {
            background-color: #f8f9fa;
            color: #6c757d;
        }
        
        .status-IN_PROGRESS {
            background-color: #cfe2ff;
            color: #0d6efd;
        }
        
        .status-COMPLETED {
            background-color: #d1e7dd;
            color: #198754;
        }
        
        .status-RISK_IDENTIFIED {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .risk-LOW {
            background-color: #d1e7dd;
            color: #198754;
        }
        
        .risk-MEDIUM {
            background-color: #fff3cd;
            color: #ffc107;
        }
        
        .risk-HIGH {
            background-color: #f8d7da;
            color: #dc3545;
        }
        
        .risk-CRITICAL {
            background-color: #842029;
            color: #ffffff;
        }
        
        /* 이미지 미리보기 스타일 */
        .preview-row {
            display: none;
            background-color: #f8f9fa;
        }
        
        .preview-cell {
            padding: 15px;
            text-align: center;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        tr.clickable {
            cursor: pointer;
        }
        
        tr.active-row {
            background-color: #e2f0ff !important;
        }
        
        /* 개선등록 버튼 스타일 */
        .btn-improve {
            background-color: #2c3e8f;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            width: 100%;
            max-width: 400px;
            padding: 8px 15px;
            border: none;
            margin-top: 10px;
        }
        
        .btn-improve:hover {
            background-color: #1e2b6a;
            color: white;
        }
        
        /* 반응형 스타일 */
        @media (max-width: 768px) {
            .search-form .row {
                flex-direction: column;
            }
            
            .search-form .col-md-6,
            .search-form .col-md-3 {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .table-responsive {
                font-size: 0.9rem;
            }
            
            .preview-image {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">기간 선택</label>
                            <div class="input-group">
                                <input type="date" class="form-control" name="startDate" th:value="${searchDto?.startDate}" placeholder="시작일">
                                <span class="input-group-text">~</span>
                                <input type="date" class="form-control" name="endDate" th:value="${searchDto?.endDate}" placeholder="종료일">
                            </div>
                        </div> -->

                                <input type="date" class="form-control" name="executionDateStart" th:value="${searchDto?.executionDateStart}" placeholder="시작일">

                    </div>
                    <div class="row">

                            <div class="btn-group">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search"></i> 검색

                                <a th:href="@{/safety/risk-factor/list}" class="btn btn-secondary">
                                    <i class="fas fa-redo"></i> 초기화

                                <a th:href="@{/safety/risk-factor/register}" class="btn btn-success">
                                    <i class="fas fa-plus"></i> 신규등록
                                </a>
                            </div>
                        </div> -->
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 알림 메시지 -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

                <div class="btn-group" style="width: 100%;">

                </div>

            <li class="nav-item">

            </li>

        </ul> -->

        <!-- 위험요인 목록 -->
        <div class="card mb-4">
            <!-- <div class="card-header">
                <i class="fas fa-table me-1"></i>
                위험요인 목록
            </div> -->
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="riskFactorTable">
                        <thead class="table-light">
                            <tr style="text-align: center;">
                                <th>번호</th>
                                <th>현장명</th>
                                <th>실시일자</th>
                                <th>공정</th>
<!--                                <th>관리</th>-->
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${riskFactors.empty}">
                                <td colspan="7" class="text-center">등록된 위험요인이 없습니다.</td>
                            </tr>
                            <tr th:each="riskFactor : ${riskFactors}" class="data-row clickable" th:data-id="${riskFactor.id}" th:data-image="${riskFactor.workImage1Url}">
                                <td th:text="${riskFactor.id}"></td>
<!--                                <td>-->
<!--                                    <a th:href="@{/safety/risk-factor/detail/{id}(id=${riskFactor.id})}" -->
<!--                                       th:text="${riskFactor.siteName}" onclick="event.stopPropagation();"></a>-->
<!--                                </td>-->
                                <td th:text="${riskFactor.siteName}"></td>

                            </a>
                        </li>
                        <li class="page-item" th:classappend="${riskFactors.first} ? 'disabled'">

                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, riskFactors.totalPages - 1)}" 
                            th:if="${i >= riskFactors.number - 2 and i <= riskFactors.number + 2}"
                            th:classappend="${i == riskFactors.number} ? 'active'">
                            <a class="page-link" th:href="@{/safety/risk-factor/list(page=${i}, name=${searchDto?.siteName}, executionDateStart=${searchDto?.executionDateStart}, executionDateEnd=${searchDto?.executionDateEnd})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${riskFactors.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/safety/risk-factor/list(page=${riskFactors.number + 1}, name=${searchDto?.siteName}, executionDateStart=${searchDto?.executionDateStart}, executionDateEnd=${searchDto?.executionDateEnd})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${riskFactors.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/safety/risk-factor/list(page=${riskFactors.totalPages - 1}, name=${searchDto?.siteName}, executionDateStart=${searchDto?.executionDateStart}, executionDateEnd=${searchDto?.executionDateEnd})}" aria-label="Last">

                            </a>
                        </li>

    <!-- 이미지 미리보기 JavaScript -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const table = document.getElementById('riskFactorTable');
            const rows = table.querySelectorAll('tr.data-row');
            
            rows.forEach(row => {
                row.addEventListener('click', function() {
                    const rowId = this.getAttribute('data-id');
                    const imageUrl = this.getAttribute('data-image');
                    
                    // 이미 미리보기가 열려있는지 확인
                    const existingPreview = document.getElementById('preview-' + rowId);
                    
                    // 모든 행의 active 클래스 제거
                    rows.forEach(r => r.classList.remove('active-row'));
                    
                    // 모든 미리보기 행 제거
                    const allPreviews = document.querySelectorAll('.preview-row');
                    allPreviews.forEach(preview => {
                        if (preview.id !== 'preview-' + rowId) {
                            preview.remove();
                        }
                    });
                    
                    // 미리보기가 이미 있으면 제거하고 종료
                    if (existingPreview) {
                        existingPreview.remove();
                        return;
                    }
                    
                    // 현재 행에 active 클래스 추가
                    this.classList.add('active-row');
                    
                    // 이미지 URL이 있는 경우에만 미리보기 생성
                    if (imageUrl) {
                        // 새 행 생성
                        const previewRow = document.createElement('tr');
                        previewRow.id = 'preview-' + rowId;
                        previewRow.className = 'preview-row';
                        
                        // 셀 생성
                        const previewCell = document.createElement('td');
                        previewCell.className = 'preview-cell';
                        previewCell.colSpan = 4; // 모든 열을 병합
                        
                        // 이미지 요소 생성
                        const img = document.createElement('img');
                        img.src = '/common/file/view/' + imageUrl;
                        img.className = 'preview-image';
                        img.alt = '현장사진1';
                        
                        // 셀에 이미지 추가
                        previewCell.appendChild(img);
                        
                        // 버튼 컨테이너 생성
                        const buttonContainer = document.createElement('div');
                        buttonContainer.className = 'mt-3';
                        
                        // 개선등록 버튼 생성
                        const improveButton = document.createElement('a');
                        improveButton.href = `/safety/risk-factor/update/${rowId}`;
                        improveButton.className = 'btn btn-improve';
                        improveButton.textContent = '개선등록';
                        improveButton.onclick = function(event) {
                            event.stopPropagation();
                        };
                        
                        // 버튼 컨테이너에 버튼 추가
                        buttonContainer.appendChild(improveButton);
                        
                        // 버튼 컨테이너를 셀에 추가
                        previewCell.appendChild(buttonContainer);
                        
                        previewRow.appendChild(previewCell);
                        
                        // 현재 행 다음에 미리보기 행 삽입
                        this.insertAdjacentElement('afterend', previewRow);
                        
                        // 애니메이션 효과로 표시
                        setTimeout(() => {
                            previewRow.style.display = 'table-row';
                        }, 10);
                    }
                });
            });
        });
    </script>
</div>
