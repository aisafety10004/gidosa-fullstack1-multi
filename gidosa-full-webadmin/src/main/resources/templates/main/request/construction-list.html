<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
  layout:decorate="~{${layout}}">

<head>
  <!-- <title>문의요청 관리(현장건설공사 문의 목록)</title> -->
  <style>
    .sortable {
      cursor: pointer;
    }

    .sortable:hover {
      background-color: #f8f9fa;
    }

    .sortable::after {
      content: "↕";
      margin-left: 5px;
      opacity: 0.5;
    }

    .sortable.asc::after {
      content: "↑";
      opacity: 1;
    }

    .sortable.desc::after {
      content: "↓";
      opacity: 1;
    }
  </style>
</head>

<body>
  <div layout:fragment="content">
    <!-- <h2>문의요청 관리(현장건설공사 문의 목록)</h2> -->
    <!-- <h2>문의사항</h2> -->

    <!-- 검색 폼 추가 -->
    <form th:action="@{/request/construction/list}" method="get" class="mb-4 mt-3" id="searchForm"
      onsubmit="return validateForm();">
      <div class="row g-3 mt-3">
        <div class="col-md-3">
          <label for="searchType" class="form-label">검색 항목</label>
          <select class="form-select" id="searchType" name="searchType">
            <option value="">선택하세요</option>
            <option value="name" th:selected="${param.searchType != null and param.searchType[0] == 'name'}">이름(직책)
            </option>
            <option value="phone" th:selected="${param.searchType != null and param.searchType[0] == 'phone'}">전화번호
            </option>
            <!-- <option value="location" th:selected="${param.searchType != null and param.searchType[0] == 'location'}">현장건설공사 현장</option> -->
            <!-- <option value="location" th:selected="${param.searchType != null and param.searchType[0] == 'location'}">현장명</option> -->
          </select>
        </div>
        <div class="col-md-6">
          <label for="searchKeyword" class="form-label">검색어</label>
          <input type="text" class="form-control" id="searchKeyword" name="searchKeyword"
            th:value="${param.searchKeyword != null ? param.searchKeyword[0] : ''}">
        </div>
        <div class="col-md-3">
          <label class="form-label">&nbsp;</label>
          <button type="submit" class="btn btn-primary w-100">검색</button>
        </div>
      </div>
      <!-- 정렬을 위한 히든 필드 추가 -->
      <input type="hidden" id="sort" name="sort" th:value="${param.sort != null ? param.sort[0] : 'id'}">
      <input type="hidden" id="direction" name="direction"
        th:value="${param.direction != null ? param.direction[0] : 'desc'}">
      <input type="hidden" id="sizeInput" name="size" th:value="${requests.size}">
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <span class="text-muted">검색 결과 총 <strong th:text="${requests.totalElements}"></strong>건이 있습니다</span>
      </div>

      <!-- 페이지 크기 선택 -->
      <div class="d-flex align-items-center">
        <label for="pageSize" class="me-2">페이지당 항목 수:</label>
        <select id="pageSize" class="form-select form-select-sm" style="width: auto;">
          <option value="10" th:selected="${requests.size == 10}">10</option>
          <option value="20" th:selected="${requests.size == 20}">20</option>
          <option value="30" th:selected="${requests.size == 30}">30</option>
        </select>
      </div>
    </div>

    <table class="table table-hover">
      <thead>
        <tr style="text-align: center;">
          <th class="sortable"
            th:classappend="${param.sort != null && param.sort[0] == 'id' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
            th:data-sort="id">ID</th>
          <th class="sortable"
            th:classappend="${param.sort != null && param.sort[0] == 'name' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
            th:data-sort="name">이름(직책)</th>
          <th class="sortable"
            th:classappend="${param.sort != null && param.sort[0] == 'phone' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
            th:data-sort="phone">전화번호</th>
          <!-- <th class="sortable"
                        th:classappend="${param.sort != null && param.sort[0] == 'location' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="constructionLocation">현장명</th> -->
          <th class="sortable"
            th:classappend="${param.sort != null && param.sort[0] == 'message' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
            th:data-sort="message">문의내용</th>
          <!-- <th class="sortable" 
                        th:classappend="${param.sort != null && param.sort[0] == 'position' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
                        th:data-sort="position">직책</th> -->
          <th class="sortable"
            th:classappend="${param.sort != null && param.sort[0] == 'createdAt' ? (param.direction != null && param.direction[0] == 'asc' ? 'asc' : 'desc') : ''}"
            th:data-sort="createdAt">등록일</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="request : ${requests}" style="cursor: pointer;"
          th:onclick="'location.href=\'' + @{/request/construction/detail/{id}(id=${request.id})} + '\''">
          <td th:text="${request.id}" style="text-align: center; width: 10%;"></td>
          <td th:text="${request.name}" style="text-align: center; width: 17%;"></td>
          <td th:text="${request.phone}" style="text-align: center; width: 17%;"></td>
          <!-- <td th:text="${request.constructionLocation}"></td> -->
          <!-- <td th:text="${#strings.length(request.message) > 20 ? request.message.substring(0, 20) + '...' : request.message}"></td> -->
          <td th:text="${request.message}"
            style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></td>
          <!-- <td th:text="${request.position}"></td> -->
          <td th:text="${#temporals.format(request.createdAt, 'yyyy-MM-dd HH:mm')}"
            style="text-align: center; width: 21%;"></td>
        </tr>
      </tbody>
    </table>

    <!-- 페이징 -->
    <nav aria-label="Page navigation" th:if="${requests.totalPages > 0}">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${!requests.hasPrevious()} ? disabled">
          <a class="page-link"
            th:href="@{/request/construction/list(page=${requests.number - 1}, size=${requests.size}, searchType=${param.searchType}, searchKeyword=${param.searchKeyword}, sort=${param.sort}, direction=${param.direction})}"
            th:unless="${!requests.hasPrevious()}">이전</a>
          <span class="page-link" th:if="${!requests.hasPrevious()}">이전</span>
        </li>

        <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, requests.totalPages - 1)}"
          th:classappend="${pageNumber == requests.number} ? active">
          <a class="page-link"
            th:href="@{/request/construction/list(page=${pageNumber}, size=${requests.size}, searchType=${param.searchType}, searchKeyword=${param.searchKeyword}, sort=${param.sort}, direction=${param.direction})}"
            th:text="${pageNumber + 1}"></a>
        </li>

        <li class="page-item" th:classappend="${!requests.hasNext()} ? disabled">
          <a class="page-link"
            th:href="@{/request/construction/list(page=${requests.number + 1}, size=${requests.size}, searchType=${param.searchType}, searchKeyword=${param.searchKeyword}, sort=${param.sort}, direction=${param.direction})}"
            th:unless="${!requests.hasNext()}">다음</a>
          <span class="page-link" th:if="${!requests.hasNext()}">다음</span>
        </li>
      </ul>
    </nav>

    <script th:inline="javascript">
      function validateForm() {
        const searchType = document.getElementById('searchType').value;

        if (!searchType) {
          alert('검색 항목을 선택하세요');
          return false;
        }

        const searchKeyword = document.getElementById('searchKeyword').value.trim();
        if (!searchKeyword) {
          alert('검색어를 입력하세요');
          return false;
        }

        return true;
      }

      // 정렬 기능 추가
      document.addEventListener('DOMContentLoaded', function () {
        const sortableHeaders = document.querySelectorAll('.sortable');
        const sortInput = document.getElementById('sort');
        const directionInput = document.getElementById('direction');
        const searchForm = document.getElementById('searchForm');

        sortableHeaders.forEach(header => {
          header.addEventListener('click', function () {
            const sortField = this.getAttribute('data-sort');
            let direction = 'asc';

            // 이미 정렬 중인 필드인 경우 방향 전환
            if (sortInput.value === sortField) {
              direction = directionInput.value === 'asc' ? 'desc' : 'asc';
            }

            sortInput.value = sortField;
            directionInput.value = direction;

            // 페이지 크기 유지를 위해 첫 페이지로 이동
            const pageInput = document.createElement('input');
            pageInput.type = 'hidden';
            pageInput.name = 'page';
            pageInput.value = '0';
            searchForm.appendChild(pageInput);

            searchForm.submit();
          });
        });

        // 페이지 크기 변경 처리
        const pageSizeSelect = document.getElementById('pageSize');
        const sizeInput = document.getElementById('sizeInput');

        pageSizeSelect.addEventListener('change', function () {
          const size = this.value;
          sizeInput.value = size;

          // 검색 폼이 있는 경우 폼 제출
          if (searchForm) {
            // 페이지 크기 변경 시 첫 페이지로 이동
            const pageInput = document.createElement('input');
            pageInput.type = 'hidden';
            pageInput.name = 'page';
            pageInput.value = '0';
            searchForm.appendChild(pageInput);

            searchForm.submit();
          } else {
            // 검색 폼이 없는 경우 URL 직접 변경
            const currentUrl = new URL(window.location.href);
            const searchParams = currentUrl.searchParams;
            searchParams.set('page', '0');
            searchParams.set('size', size);
            window.location.href = currentUrl.toString();
          }
        });
      });
    </script>
  </div>
</body>

</html>
