<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{${layout}}">
<head>
    <title>현장건설공사 문의요청 목록</title>
</head>
<body>
    <div layout:fragment="content">
        <h2>현장건설공사 문의 목록</h2>
        
        <!-- 검색 폼 추가 -->
        <form th:action="@{/request/construction/list}" method="get" class="mb-4" id="searchForm" onsubmit="return validateForm();">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="searchType" class="form-label">검색 항목</label>
                    <select class="form-select" id="searchType" name="searchType">
                        <option value="">선택하세요</option>
                        <option value="name" th:selected="${param.searchType != null and param.searchType[0] == 'name'}">이름</option>
                        <option value="phone" th:selected="${param.searchType != null and param.searchType[0] == 'phone'}">전화번호</option>
                        <option value="location" th:selected="${param.searchType != null and param.searchType[0] == 'location'}">현장건설공사 현장</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="searchKeyword" class="form-label">검색어</label>
                    <input type="text" class="form-control" id="searchKeyword" name="searchKeyword" 
                           th:value="${param.searchKeyword != null ? param.searchKeyword[0] : ''}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <button type="submit" class="btn btn-primary w-100">검색</button>
                </div>
            </div>
        </form>
        
        <div>
            <h3>검색 결과 총 <span th:text="${requests.totalElements}"></span>건</h3>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>이름</th>
                    <th>전화번호</th>
                    <th>현장건설공사 현장</th>
                    <th>직책</th>
                    <th>등록일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="request : ${requests}">
                    <td th:text="${request.id}"></td>
                    <td th:text="${request.name}"></td>
                    <td th:text="${request.phone}"></td>
                    <td th:text="${request.constructionLocation}"></td>
                    <td th:text="${request.position}"></td>
                    <td th:text="${#temporals.format(request.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </tbody>
        </table>
        
        <!-- 페이징 -->
        <nav aria-label="Page navigation" th:if="${requests.totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!requests.hasPrevious()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/request/construction/list(page=${requests.number - 1}, searchType=${param.searchType}, searchKeyword=${param.searchKeyword})}"
                       th:unless="${!requests.hasPrevious()}">이전</a>
                    <span class="page-link" th:if="${!requests.hasPrevious()}">이전</span>
                </li>

                <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, requests.totalPages - 1)}"
                    th:classappend="${pageNumber == requests.number} ? active">
                    <a class="page-link" 
                       th:href="@{/request/construction/list(page=${pageNumber}, searchType=${param.searchType}, searchKeyword=${param.searchKeyword})}"
                       th:text="${pageNumber + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${!requests.hasNext()} ? disabled">
                    <a class="page-link" 
                       th:href="@{/request/construction/list(page=${requests.number + 1}, searchType=${param.searchType}, searchKeyword=${param.searchKeyword})}"
                       th:unless="${!requests.hasNext()}">다음</a>
                    <span class="page-link" th:if="${!requests.hasNext()}">다음</span>
                </li>
            </ul>
        </nav>
        
        <script th:inline="javascript">
            function validateForm() {
                const searchType = document.getElementById('searchType').value;
                
                if (!searchType) {
                    alert('검색 항목을 선택하세요');
                    return false;
                }

                const searchKeyword = document.getElementById('searchKeyword').value.trim();
                if (!searchKeyword) {
                    alert('검색어를 입력하세요');
                    return false;
                }
                
                return true;
            }
        </script>
    </div>
</body>
</html>
