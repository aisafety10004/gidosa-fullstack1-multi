repositories {
    mavenCentral()
}

dependencies {
    implementation project(path: ':gidosa-common')
//    implementation project(path: ':gidosa-auth')
//    implementation project(path: ':gidosa-common-api')
    implementation project(path: ':gidosa-rdb')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // thymeleaf with dialect
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.4.0'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // mybatis 사용
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

//    // jsp-
//    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.35'
////    p rovidedRuntime "org.springframework.boot:spring-boot-starter-tomcat"
//    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
////    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0' // 서블릿 API 제공
//    // JSP를 포함한 WAR 빌드 시 필요
//    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
//    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    compileOnly 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
//	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    //runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.mysql:mysql-connector-j'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation project(path: ':gidosa-common')
//    testImplementation project(path: ':gidosa-common-api')
//    testImplementation project(path: ':gidosa-auth')
    testImplementation project(path: ':gidosa-rdb')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
    testImplementation 'org.springframework.security:spring-security-test'
}

test {
    useJUnitPlatform()
}

